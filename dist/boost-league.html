function extrudePoly(pts, width) {
  const s = new THREE.Shape();
  pts.forEach((p, i) => (i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])));
  const geo = new THREE.ExtrudeGeometry(s, { depth: width, bevelEnabled: true, bevelThickness: 3, bevelSize: 3, bevelSegments: 2, curveSegments: 4 });
  geo.translate(0, 0, -width / 2);
  // planar UVs: sides use (x,y), top/front/back use (x,z)
  geo.computeVertexNormals();
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < pos.count; i++) { minX = Math.min(minX, pos.getX(i)); maxX = Math.max(maxX, pos.getX(i)); minY = Math.min(minY, pos.getY(i)); maxY = Math.max(maxY, pos.getY(i)); }
  for (let i = 0; i < pos.count; i++) {
    const u = (pos.getX(i) - minX) / (maxX - minX);
    if (Math.abs(nrm.getZ(i)) > 0.6) uv.setXY(i, u, (pos.getY(i) - minY) / (maxY - minY));
    else uv.setXY(i, u, pos.getZ(i) / (width + 6) + 0.5);
  }
  return geo;
}

function decalTexture(decal, base, accent) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = hex2css(base); g.fillRect(0, 0, w, h);
    const ac = hex2css(accent);
    g.fillStyle = ac; g.strokeStyle = ac;
    switch (decal) {
      case 'stripes': g.fillRect(0, h * 0.40, w, h * 0.07); g.fillRect(0, h * 0.53, w, h * 0.07); break;
      case 'flames':
        for (let i = 0; i < 9; i++) { g.beginPath(); const y = h * (0.15 + i * 0.09); g.moveTo(w, y - 10); g.quadraticCurveTo(w * 0.7, y - 20, w * (0.25 + Math.random() * 0.2), y); g.quadraticCurveTo(w * 0.7, y + 18, w, y + 10); g.fill(); }
        g.fillStyle = 'rgba(255,220,60,0.8)'; for (let i = 0; i < 9; i++) { g.beginPath(); const y = h * (0.15 + i * 0.09); g.moveTo(w, y - 4); g.quadraticCurveTo(w * 0.8, y - 8, w * 0.55, y); g.quadraticCurveTo(w * 0.8, y + 8, w, y + 4); g.fill(); }
        break;
      case 'tiger': for (let i = 0; i < 14; i++) { g.beginPath(); const x = i * w / 14; g.moveTo(x, 0); g.lineTo(x + 14, h * 0.35); g.lineTo(x + 4, h * 0.5); g.lineTo(x + 16, h * 0.65); g.lineTo(x, h); g.lineTo(x + 8, h * 0.5); g.fill(); } break;
      case 'checker': for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2 && x > 4) g.fillRect(x * w / 8, y * h / 8, w / 8, h / 8); break;
      case 'lightning': g.lineWidth = 8; for (let k = 0; k < 3; k++) { g.beginPath(); let y = h * (0.3 + k * 0.2); g.moveTo(0, y); for (let x = 0; x < w; x += 24) { y += (Math.random() - 0.5) * 40; g.lineTo(x, y); } g.stroke(); } break;
      case 'dots': for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 6 + Math.random() * 10, 0, Math.PI * 2); g.fill(); } break;
      case 'camo': for (let i = 0; i < 60; i++) { g.fillStyle = pick([ac, '#2f3a24', '#58613d', hex2css(base)]); g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 10 + Math.random() * 25, 6 + Math.random() * 14, Math.random() * 3, 0, Math.PI * 2); g.fill(); } break;
    }
    // panel line + shading
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, 0, w, h * 0.06); g.fillRect(0, h * 0.94, w, h * 0.06);
  });
}

function buildCar(car) {
  const lo = car.loadout || {};
  const shape = CAR_SHAPES[car.bodyKey] || CAR_SHAPES.striker;
  const tc = TEAM_COLORS[car.team];
  const paint = PAINTS[lo.paint || 0];
  const accent = paint && paint.hex !== null ? paint.hex : (lo.accent || 0xeeeeee);
  const grp = new THREE.Group();
  const model = new THREE.Group(); grp.add(model);
  const base = tc.main;
  const bodyMat = new THREE.MeshStandardMaterial({ map: decalTexture(lo.decal || 'none', base, accent), roughness: 0.35, metalness: 0.35 });
  const lower = new THREE.Mesh(extrudePoly(shape.lower, shape.w - 6), bodyMat); model.add(lower);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x0d1420, roughness: 0.1, metalness: 0.8 });
  const cabin = new THREE.Mesh(extrudePoly(shape.cabin, shape.cw - 6), glassMat); model.add(cabin);
  // roof plate
  const c = shape.cabin;
  const roofY = c[1][1], roofX0 = c[1][0], roofX1 = c[2][0];
  const roofMat = new THREE.MeshStandardMaterial({ color: tc.dark, roughness: 0.4, metalness: 0.3 });
  const roof = new THREE.Mesh(new THREE.BoxGeometry(roofX1 - roofX0 + 4, 4, shape.cw - 2), roofMat);
  roof.position.set((roofX0 + roofX1) / 2, roofY + 2, 0); model.add(roof);
  if (shape.spoiler) {
    const sp = new THREE.Mesh(new THREE.BoxGeometry(14, 3, shape.w), new THREE.MeshStandardMaterial({ color: accent, roughness: 0.4 }));
    const rear = shape.lower[1];
    sp.position.set(rear[0] + 6, rear[1] + 12, 0); model.add(sp);
    for (const z of [-1, 1]) { const st = new THREE.Mesh(new THREE.BoxGeometry(4, 12, 3), roofMat); st.position.set(rear[0] + 8, rear[1] + 5, z * shape.w * 0.3); model.add(st); }
  }
  if (shape.fins) for (const z of [-1, 1]) { const f = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 3), new THREE.MeshStandardMaterial({ color: accent })); f.position.set(-50, 22, z * 30); f.rotation.z = 0.4; model.add(f); }
  // lights
  const front = shape.lower[shape.lower.length - 2];
  const hl = new THREE.MeshBasicMaterial({ color: 0xfff6d0 });
  for (const z of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 12), hl); l.position.set(front[0] + 1, front[1] - 1, z * shape.w * 0.32); model.add(l); }
  const tlm = new THREE.MeshBasicMaterial({ color: 0xff2030 });
  const rear0 = shape.lower[0];
  for (const z of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 14), tlm); l.position.set(rear0[0] - 3, 12, z * shape.w * 0.3); model.add(l); }
  // exhaust
  const exMat = new THREE.MeshStandardMaterial({ color: 0x444a52, metalness: 0.9, roughness: 0.3 });
  const exhaust = new V3(rear0[0] - 4, 9, 0);
  const ex = new THREE.Mesh(new THREE.CylinderGeometry(6, 7, 10, 10), exMat); ex.rotation.z = Math.PI / 2; ex.position.copy(exhaust); model.add(ex);
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  const flame = new THREE.Mesh(new THREE.ConeGeometry(7, 40, 10), flameMat); flame.rotation.z = Math.PI / 2; flame.position.set(exhaust.x - 22, exhaust.y, 0); flame.visible = false; model.add(flame);

  // wheels
  const b = car.body;
  const wheels = [];
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.9 });
  const rimCol = { classic: 0xc0c6cf, spinner: 0xe8e8e8, neon: 0x30f0ff, gold: 0xffc83a, offroad: 0x333333, star: 0xff4fd8 }[lo.wheels || 'classic'];
  const rimMat = new THREE.MeshStandardMaterial({ color: rimCol, metalness: 0.8, roughness: 0.25, emissive: lo.wheels === 'neon' ? 0x30f0ff : 0x000000, emissiveIntensity: 0.6 });
  for (const [x, r] of [[b.wf, b.rf], [b.wb, b.rb]]) for (const z of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(x, r - PHYS.REST_HEIGHT, z * (shape.w / 2 - 2));
    const spin = new THREE.Group(); pivot.add(spin);
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, lo.wheels === 'offroad' ? 16 : 12, 18), tireMat); tire.rotation.x = Math.PI / 2; spin.add(tire);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.62, r * 0.62, 13, lo.wheels === 'star' ? 5 : 10), rimMat); rim.rotation.x = Math.PI / 2; spin.add(rim);
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(r * 1.1, r * 0.2, 13.5), tireMat); spin.add(spoke);
    model.add(pivot);
    wheels.push({ pivot, spin, front: x > 0 });
  }
  // topper / antenna
  addTopper(model, lo.topper, roofX0, roofX1, roofY + 4, accent, car.team);
  addAntenna(model, lo.antenna, rear0[0] + 10, shape.lower[1][1] + 2, -shape.w * 0.32, car.team);

  // under-glow shadow blob
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(b.l * 1.3, b.w * 1.4), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false, map: blobTex() }));
  shadow.rotation.x = -Math.PI / 2; shadow.renderOrder = 1;
  R.world.add(shadow);

  // nameplate
  const plate = makeNameplate(car);
  grp.add(plate);
  return { group: grp, model, wheels, flame, flameMat, exhaust, shadow, plate, bodyMat };
}

let _blobTex = null;
function blobTex() {
  if (_blobTex) return _blobTex;
  _blobTex = canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 4, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  return _blobTex;
}

function addTopper(model, t, x0, x1, y, accent, team) {
  if (!t || t === 'none') return;
  const g = new THREE.Group(); g.position.set((x0 + x1) / 2, y, 0); model.add(g);
  const M = (c, e) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, emissive: e || 0, emissiveIntensity: 0.6 });
  if (t === 'cap') { const c = new THREE.Mesh(new THREE.SphereGeometry(14, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(accent)); g.add(c); const v = new THREE.Mesh(new THREE.BoxGeometry(16, 2, 20), M(accent)); v.position.set(14, 0, 0); g.add(v); }
  if (t === 'crown') { const c = new THREE.Mesh(new THREE.CylinderGeometry(14, 12, 12, 8, 1, true), M(0xffc83a, 0x553300)); c.material.side = THREE.DoubleSide; c.position.y = 6; g.add(c); for (let i = 0; i < 8; i++) { const s = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 4), M(0xffc83a)); s.position.set(Math.cos(i * 0.785) * 13, 15, Math.sin(i * 0.785) * 13); g.add(s); } }
  if (t === 'halo') { const h = new THREE.Mesh(new THREE.TorusGeometry(14, 2.5, 6, 20), M(0xfff2a0, 0xfff2a0)); h.rotation.x = Math.PI / 2; h.position.y = 20; g.add(h); }
  if (t === 'propeller') { const c = new THREE.Mesh(new THREE.SphereGeometry(12, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(TEAM_COLORS[team].light)); g.add(c); const p = new THREE.Mesh(new THREE.BoxGeometry(36, 1.5, 5), M(0xff3030)); p.position.y = 14; p.userData.spin = true; g.add(p); g.userData.prop = p; }
  if (t === 'cone') { const c = new THREE.Mesh(new THREE.ConeGeometry(10, 28, 12), M(0xff7a1a)); c.position.y = 14; g.add(c); const s = new THREE.Mesh(new THREE.CylinderGeometry(6.6, 7.6, 5, 12), M(0xffffff)); s.position.y = 14; g.add(s); }
  if (t === 'horns') for (const z of [-1, 1]) { const h = new THREE.Mesh(new THREE.ConeGeometry(4, 18, 8), M(0xcc1111)); h.position.set(0, 8, z * 12); h.rotation.x = z * 0.4; g.add(h); }
  model.userData.topper = g;
}
function addAntenna(model, t, x, y, z, team) {
  if (!t || t === 'none') return;
  const g = new THREE.Group(); g.position.set(x, y, z); model.add(g);
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 50, 4), new THREE.MeshBasicMaterial({ color: 0x222222 })); stick.position.y = 25; g.add(stick);
  const top = new THREE.Group(); top.position.y = 52; g.add(top);
  const tc = TEAM_COLORS[team];
  if (t === 'flag') { const f = new THREE.Mesh(new THREE.PlaneGeometry(22, 14), new THREE.MeshBasicMaterial({ color: tc.main, side: THREE.DoubleSide })); f.position.set(-11, -6, 0); top.add(f); }
  if (t === 'ball') top.add(new THREE.Mesh(new THREE.SphereGeometry(7, 10, 8), new THREE.MeshStandardMaterial({ color: 0xdddddd })));
  if (t === 'star') top.add(new THREE.Mesh(new THREE.OctahedronGeometry(8), new THREE.MeshBasicMaterial({ color: 0xffd23a })));
  if (t === 'heart') top.add(new THREE.Mesh(new THREE.SphereGeometry(7, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff3b7a })));
  if (t === 'bolt') top.add(new THREE.Mesh(new THREE.ConeGeometry(5, 16, 4), new THREE.MeshBasicMaterial({ color: 0xffe23a })));
  model.userData.antenna = g;
}

function makeNameplate(car) {
  const tc = TEAM_COLORS[car.team];
  const tex = canvasTex(256, 64, (g, w, h) => {
    g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.75)'; g.strokeText(car.name, w / 2, h / 2);
    g.fillStyle = car.team === 0 ? '#9cc4ff' : '#ffc08a'; g.fillText(car.name, w / 2, h / 2);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false }));
  sp.scale.set(0.16, 0.04, 1); sp.position.set(0, 110, 0); sp.renderOrder = 50;
  void tc;
  return sp;
}

// ---------------------------------------------------------------------------
// Per-frame sync
// ---------------------------------------------------------------------------
function syncCarView(car, v, state) {
  // state: optional replay frame data [x,y,z,qx,qy,qz,qw,boost,demo,ss,wheel,steer]
  let px, py, pz, boosting, demo, wheelSpin, steer;
  if (state) {
    px = state[0]; py = state[1]; pz = state[2];
    v.group.quaternion.set(state[3], state[4], state[5], state[6]);
    boosting = state[7]; demo = state[8]; wheelSpin = state[10]; steer = state[11];
  } else {
    px = car.pos.x; py = car.pos.y; pz = car.pos.z; v.group.quaternion.copy(car.quat);
    if (car.visOff) { px += car.visOff.x; py += car.visOff.y; pz += car.visOff.z; } // online: smooth out corrections
    boosting = car.boosting; demo = car.demolished; wheelSpin = car.wheelSpin; steer = car.steerVis;
  }
  v.group.position.set(px, py, pz);
  v.group.visible = !demo;
  v.shadow.visible = !demo;
  for (const w of v.wheels) {
    w.spin.rotation.z = -wheelSpin;
    if (w.front) w.pivot.rotation.y = -steer * 0.45;
  }
  v.flame.visible = !!boosting;
  if (boosting) { v.flame.scale.set(1, 0.8 + Math.random() * 0.6, 1); }
  const tp = v.model.userData.topper; if (tp && tp.userData.prop) tp.userData.prop.rotation.y += 0.4;
  const an = v.model.userData.antenna; if (an) an.rotation.z = Math.sin(R.time * 8 + car.id) * 0.08 + (car.vel ? clamp(car.vel.length() / 2300, 0, 1) * 0.3 : 0);
  // blob shadow on the floor
  const d = arenaDist(px, py, pz, false);
  if (py < 900 && d < 600) {
    v.shadow.position.set(px, 1.2, pz);
    const s = clamp(1 - py / 900, 0.2, 1);
    v.shadow.material.opacity = 0.45 * s;
    v.shadow.visible = !demo && py < 900;
  } else v.shadow.visible = false;
  v.plate.visible = Settings.nameplates && !demo && car !== (typeof Game !== 'undefined' && CUR && CUR.game ? CUR.game.player : null);
}

function syncBallView(ball, state, hidden) {
  const v = R.ballView;
  if (state) { v.group.position.set(state[0], state[1], state[2]); v.mesh.quaternion.set(state[3], state[4], state[5], state[6]); hidden = state[7]; }
  else { v.group.position.copy(ball.pos); if (ball.visOff) v.group.position.add(ball.visOff); v.mesh.quaternion.copy(ball.quat); }
  v.group.visible = !hidden;
  const p = v.group.position;
  v.shadow.visible = !hidden && p.y < 2000 && Math.abs(p.z) < ARENA.L;
  v.shadow.position.set(p.x, 1.4, p.z);
  const s = clamp(1 - p.y / 2200, 0.3, 1);
  v.shadow.scale.setScalar(0.6 + s * 0.4);
  v.shadow.material.opacity = 0.55 * s;
  // ball states
  if (ball.kind === 'dropshot') {
    const lv = ball.chargeLevel || 0;
    const col = ball.dsTeam === undefined || ball.dsTeam < 0 ? 0x000000 : TEAM_COLORS[ball.dsTeam].main;
    v.mat.emissive.set(col); v.mat.emissiveIntensity = 0.25 + lv * 0.45;
  } else if (ball.frozen > 0) { v.mat.emissive.set(0x66ccff); v.mat.emissiveIntensity = 0.7; }
  else if (CUR.game && CUR.game.mode === 'heatseeker' && CUR.game.heat.target >= 0) { v.mat.emissive.set(TEAM_COLORS[1 - CUR.game.heat.target].main); v.mat.emissiveIntensity = 0.45 + 0.15 * Math.sin(R.time * 10); }
  else { v.mat.emissive.set(0x3a3d44); v.mat.emissiveIntensity = 1; }
}

function syncPads(game, dt) {
  for (const v of R.padViews) {
    const p = v.p;
    v.orb.visible = p.active;
    v.ringMat.color.set(p.active ? 0xffb020 : 0x553a10);
    if (p.big && p.active) { v.orb.position.y = 85 + Math.sin(R.time * 2 + p.i) * 10; v.orb.rotation.y += dt; }
  }
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
function updateCamera(dt, game, replayFrame) {
  const C = R.cam, cam = R.camera;
  const car = game.player;
  const ball = game.ball;
  const S = Settings;
  if (replayFrame) {
    // cinematic replay camera: orbit-follow the ball
    const bp = tmpV(replayFrame.b[0], replayFrame.b[1], replayFrame.b[2]);
    const a = R.time * 0.25;
    const want = tmpV(bp.x + Math.cos(a) * 1300, Math.max(250, bp.y + 450), bp.z + Math.sin(a) * 1300 - sign(bp.z) * 600);
    keepInArena(want, 60);
    C.pos.lerp(want, damp(3, dt)); C.look.lerp(bp, damp(6, dt));
    cam.position.copy(C.pos); cam.up.set(0, 1, 0); cam.lookAt(C.look);
    return;
  }
  if (game.state === 'ended' || CUR.menuCam) {
    const a = R.time * 0.08;
    const want = tmpV(Math.cos(a) * 5200, 1500, Math.sin(a) * 6200);
    C.pos.lerp(want, damp(1, dt)); C.look.lerp(tmpV(0, 200, 0), damp(2, dt));
    cam.position.copy(C.pos); cam.up.set(0, 1, 0); cam.lookAt(C.look);
    return;
  }
  let focus = tmpV().copy(car.pos);
  if (car.demolished) {
    // spectate the ball from the death spot
    C.look.lerp(ball.pos, damp(4, dt));
    cam.position.copy(C.pos); cam.lookAt(C.look);
    return;
  }
  const carUp = car.up(tmpV());
  // on walls the camera leans with the car but stays partly upright (less disorienting)
  const wantUp = tmpV().copy(UP);
  if (car.onGround && car.groundN.y < 0.9 && car.groundN.y > -0.3) wantUp.lerp(car.groundN, 0.55).normalize();
  if (!car.onGround && car.wallTime > 0) wantUp.copy(UP);
  C.up.lerp(wantUp, damp(car.onGround ? 6 : 3, dt)).normalize();
  let dir;
  const tgtPos = game.ballHidden && game.lastGoalPos ? game.lastGoalPos : ball.pos;
  const useBall = C.ballCam && (!game.ballHidden || !!game.lastGoalPos);
  if (useBall) {
    dir = tmpV().copy(tgtPos).sub(car.pos);
    dir.addScaledVector(C.up, -dir.dot(C.up));
    if (dir.length() < 50) dir.copy(car.fwd(tmpV()));
    dir.normalize();
  } else {
    dir = car.fwd(tmpV());
    if (!car.onGround) { const v = tmpV().copy(car.vel); v.addScaledVector(C.up, -v.dot(C.up)); if (v.length() > 300) dir.copy(v); }
    dir.addScaledVector(C.up, -dir.dot(C.up));
    if (dir.lengthSq() < 1e-4) dir.copy(C.dir);
    dir.normalize();
  }
  const stiff = 2 + S.camStiffness * 14;
  C.dir.lerp(dir, damp(useBall ? stiff * 1.4 : stiff, dt)).normalize();
  const dist = S.camDist, height = S.camHeight;
  // right stick / R3 swivel (rear view)
  C.yaw = lerp(C.yaw || 0, Input.camYaw || 0, damp(12, dt));
  const camDir = (C.cd || (C.cd = new V3())).copy(C.dir);
  if (Math.abs(C.yaw) > 0.001) camDir.applyAxisAngle(C.up, -C.yaw);
  const pos = tmpV().copy(focus).addScaledVector(camDir, -dist).addScaledVector(C.up, height);
  keepInArena(pos, 40);
  C.pos.copy(pos);
  let look;
  if (useBall) {
    const tb = tmpV().copy(tgtPos).sub(focus);
    const ang = Math.atan2(tb.dot(C.up), Math.max(1, Math.hypot(tb.dot(C.dir), 0)));
    const lim = clamp(ang, -0.2, 0.75);
    look = tmpV().copy(focus).addScaledVector(C.up, 40).addScaledVector(C.dir, 300).addScaledVector(C.up, Math.tan(lim) * 300);
  } else {
    look = tmpV().copy(focus).addScaledVector(camDir, 300).addScaledVector(C.up, 40);
  }
  if (useBall && Math.abs(C.yaw) > 0.3) look = tmpV().copy(focus).addScaledVector(camDir, 300).addScaledVector(C.up, 40);
  look.addScaledVector(C.up, Math.tan(THREE.MathUtils.degToRad(S.camAngle)) * 300);
  C.look.copy(look);
  // shake
  if (S.camShake && C.shake > 0) {
    C.shake = Math.max(0, C.shake - dt * 2.5);
    const k = C.shake * C.shake * 25;
    C.pos.x += rand(-k, k); C.pos.y += rand(-k, k); C.pos.z += rand(-k, k);
  }
  cam.position.copy(C.pos); cam.up.copy(C.up); cam.lookAt(C.look);
  void carUp;
}
function keepInArena(p, margin) {
  for (let i = 0; i < 3; i++) {
    const d = arenaDist(p.x, p.y, p.z, false);
    if (d >= margin) return;

  R.time += dt;

  },
};

<script>/* src/audio.js */
'use strict';
// ============================================================================
// Procedural audio (Web Audio): engine, boost, hits, horns, crowd, music
// ============================================================================

const Sound = {
  ctx: null, ready: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(this.master);
    this.sfx = ctx.createGain(); this.sfx.connect(comp);
    this.musicBus = ctx.createGain(); this.musicBus.connect(comp);
    this.crowdBus = ctx.createGain(); this.crowdBus.connect(comp);
    this.applyVolumes();
    // noise buffer
    const len = ctx.sampleRate * 2;
    this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.initEngine(); this.initCrowd();
    // iOS unlock blip
    const o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(this.sfx); o.start(); o.stop(ctx.currentTime + 0.01);
    this.ready = true;
  },
  applyVolumes() {
    if (!this.ctx) return;
    this.master.gain.value = Settings.master;
    this.sfx.gain.value = Settings.sfx;
    this.musicBus.gain.value = Settings.music * 0.5;
    this.crowdBus.gain.value = Settings.crowd;
  },
  now() { return this.ctx.currentTime; },

  initEngine() {
    const ctx = this.ctx;
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth';
    const o2 = ctx.createOscillator(); o2.type = 'square';
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; lp.Q.value = 2;
    const g = ctx.createGain(); g.gain.value = 0;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.sfx);
    o1.start(); o2.start();
    // boost hiss
    const n = ctx.createBufferSource(); n.buffer = this.noise; n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
    const bg = ctx.createGain(); bg.gain.value = 0;
    n.connect(bp); bp.connect(bg); bg.connect(this.sfx); n.start();
    // supersonic wind
    const w = ctx.createBufferSource(); w.buffer = this.noise; w.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = 'highpass'; wf.frequency.value = 2500;
    const wg = ctx.createGain(); wg.gain.value = 0;
    w.connect(wf); wf.connect(wg); wg.connect(this.sfx); w.start();
    // tyre screech for powerslides
    const sq = ctx.createBufferSource(); sq.buffer = this.noise; sq.loop = true;
    const sf = ctx.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 2600; sf.Q.value = 6;
    const sg = ctx.createGain(); sg.gain.value = 0;
    sq.connect(sf); sf.connect(sg); sg.connect(this.sfx); sq.start();
    this.eng = { o1, o2, lp, g, bg, bp, wg, sg };
  },
  initCrowd() {
    const ctx = this.ctx;
    const n = ctx.createBufferSource(); n.buffer = this.noise; n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
    const g = ctx.createGain(); g.gain.value = 0;
    n.connect(bp); bp.connect(g); g.connect(this.crowdBus); n.start();
    this.crowd = { g, bp, base: 0 };
  },
  setCrowd(level) { if (!this.ctx) return; this.crowd.base = level; this.crowd.g.gain.setTargetAtTime(level * 0.12, this.now(), 0.6); },
  cheer(amount, dur) {
    if (!this.ctx) return;
    const g = this.crowd.g.gain, t = this.now();
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.12 + amount * 0.35, t + 0.25);
    g.setTargetAtTime(this.crowd.base * 0.12, t + dur, 0.8);
    this.crowd.bp.frequency.setValueAtTime(900 + amount * 400, t);
  },

  updateCar(car, inGame) {
    if (!this.ready || !this.eng) return;
    const e = this.eng, t = this.now();
    if (!inGame || !car || car.demolished) { e.g.gain.setTargetAtTime(0, t, 0.1); e.bg.gain.setTargetAtTime(0, t, 0.05); e.wg.gain.setTargetAtTime(0, t, 0.1); e.sg.gain.setTargetAtTime(0, t, 0.05); return; }
    const sp = car.vel.length() / 2300;
    const thr = Math.abs(car.ctrl.throttle) + (car.boosting ? 1 : 0);
    const f = 45 + sp * 120 + (car.onGround ? 0 : 20);
    e.o1.frequency.setTargetAtTime(f, t, 0.05); e.o2.frequency.setTargetAtTime(f * 0.501, t, 0.05);
    e.lp.frequency.setTargetAtTime(300 + thr * 500 + sp * 900, t, 0.05);
    e.g.gain.setTargetAtTime(0.035 + thr * 0.03 + sp * 0.03, t, 0.05);
    e.bg.gain.setTargetAtTime(car.boosting ? 0.22 : 0, t, 0.03);
    e.bp.frequency.setTargetAtTime(700 + sp * 900, t, 0.05);
    e.wg.gain.setTargetAtTime(car.supersonic ? 0.06 : 0, t, 0.2);
    e.sg.gain.setTargetAtTime(car.onGround ? car.slideAmt * 0.14 : 0, t, 0.06);
  },

  // ---- one-shots ----
  tone(freq, dur, type, vol, slide, when) {
    const ctx = this.ctx, t = (when || this.now());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noiseHit(dur, freq, vol, type, when, q) {
    const ctx = this.ctx, t = (when || this.now());
    const s = ctx.createBufferSource(); s.buffer = this.noise;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
    return f;
  },
  play(name, opt) {
    if (!this.ready) return;
    const v = opt && opt.vol !== undefined ? opt.vol : 1;
    if (v < 0.02) return;
    switch (name) {
      case 'hit': { const s = clamp(opt.s, 0.1, 1.5); this.tone(120 + s * 40, 0.25, 'sine', 0.5 * s * v, 0.4); this.noiseHit(0.12, 1800 + s * 2000, 0.35 * s * v); if (s > 0.8) this.noiseHit(0.4, 600, 0.3 * v); break; }
      case 'bounce': this.tone(90, 0.18, 'sine', 0.25 * v, 0.5); this.noiseHit(0.08, 900, 0.12 * v); break;
      case 'jump': { const f = this.noiseHit(0.18, 600, 0.12 * v, 'bandpass'); f.frequency.exponentialRampToValueAtTime(2400, this.now() + 0.18); break; }
      case 'dodge': { const f = this.noiseHit(0.35, 400, 0.18 * v, 'bandpass'); f.frequency.exponentialRampToValueAtTime(3000, this.now() + 0.3); break; }
      case 'land': this.tone(70, 0.15, 'sine', 0.2 * v, 0.6); this.noiseHit(0.1, 500, 0.1 * v); break;
      case 'padSmall': this.tone(1200, 0.08, 'triangle', 0.08 * v, 1.5); break;
      case 'padBig': [0, 0.06, 0.12].forEach((d, i) => this.tone(660 * Math.pow(1.26, i), 0.18, 'triangle', 0.12 * v, 1.2, this.now() + d)); break;
      case 'demo': this.noiseHit(1.2, 500, 0.8 * v); this.tone(60, 0.9, 'sawtooth', 0.35 * v, 0.3); this.noiseHit(0.3, 3000, 0.3 * v, 'highpass'); break;
      case 'bump': this.tone(100, 0.2, 'square', 0.15 * v, 0.5); this.noiseHit(0.15, 1200, 0.25 * v); break;
      case 'horn': {
        const t = this.now();
        for (const [f, d] of [[220, 0], [277, 0], [330, 0], [440, 0]]) { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.09 * v, t + d + 0.05); g.gain.setValueAtTime(0.09 * v, t + 1.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9); o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + 2); }
        this.noiseHit(1.5, 300, 0.5 * v);
        break;
      }
      case 'count': this.tone(520, 0.18, 'square', 0.12 * v); break;
      case 'go': this.tone(1040, 0.5, 'square', 0.14 * v); this.tone(780, 0.5, 'square', 0.08 * v); break;
      case 'click': this.tone(900, 0.04, 'triangle', 0.08 * v); break;
      case 'select': this.tone(600, 0.06, 'triangle', 0.1 * v, 1.6); break;
      case 'back': this.tone(500, 0.07, 'triangle', 0.08 * v, 0.6); break;
      case 'chat': this.tone(1500, 0.05, 'sine', 0.08 * v); this.tone(2000, 0.06, 'sine', 0.06 * v, 1, this.now() + 0.05); break;
      case 'award': this.tone(880, 0.12, 'triangle', 0.08 * v, 1.2); break;
      case 'item': [0, 0.07].forEach((d, i) => this.tone(900 + i * 400, 0.12, 'sine', 0.12 * v, 1, this.now() + d)); break;
      case 'itemuse': this.tone(300, 0.3, 'sawtooth', 0.12 * v, 3); break;
      case 'flipreset': [0, 0.05, 0.1].forEach((d, i) => this.tone(1000 + i * 300, 0.1, 'sine', 0.12 * v, 1, this.now() + d)); break;
      case 'levelup': [0, 0.1, 0.2, 0.3].forEach((d, i) => this.tone(523 * Math.pow(1.26, i), 0.25, 'triangle', 0.14 * v, 1, this.now() + d)); break;
      case 'whoosh': { const f = this.noiseHit(0.6, 300, 0.25 * v, 'bandpass'); f.frequency.exponentialRampToValueAtTime(2000, this.now() + 0.5); break; }
      case 'tile': this.noiseHit(0.3, 2500, 0.3 * v, 'highpass'); this.tone(200, 0.2, 'square', 0.1 * v, 0.5); break;
    }
  },

  // ---- music: simple synthwave loop with lookahead scheduler ----
  music: null,
  startMusic() {
    if (!this.ready || this.music) return;
    const ctx = this.ctx;
    const bpm = 112, step = 60 / bpm / 4;
    const prog = [[45, 52, 57, 60], [41, 48, 53, 57], [48, 55, 60, 64], [43, 50, 55, 59]];
    const m = { next: ctx.currentTime + 0.1, i: 0, timer: null };
    const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
    const note = (f, t, d, type, vol, cutoff) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = type; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = cutoff || 2000;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(lp); lp.connect(g); g.connect(this.musicBus); o.start(t); o.stop(t + d + 0.05);
    };
    const tick = () => {
      while (m.next < ctx.currentTime + 0.25) {
        const bar = Math.floor(m.i / 16) % 4, s = m.i % 16, ch = prog[bar], t = m.next;
        if (s % 2 === 0) note(mtof(ch[0] - 12), t, step * 1.8, 'sawtooth', 0.09, 500);
        note(mtof(ch[(s * 3) % 4] + 12), t, step * 0.9, 'square', 0.025, 2400);
        if (s % 4 === 0) { // kick
          const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
          g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(this.musicBus); o.start(t); o.stop(t + 0.25);
        }
        if (s % 8 === 4) { const sN = ctx.createBufferSource(); sN.buffer = this.noise; const g = ctx.createGain(); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1500; g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); sN.connect(f); f.connect(g); g.connect(this.musicBus); sN.start(t, Math.random()); sN.stop(t + 0.2); }
        if (s % 2 === 1) { const sN = ctx.createBufferSource(); sN.buffer = this.noise; const g = ctx.createGain(); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(0.025, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); sN.connect(f); f.connect(g); g.connect(this.musicBus); sN.start(t, Math.random()); sN.stop(t + 0.06); }
        if (s === 0) for (const n of ch) note(mtof(n + 12), t, step * 15, 'triangle', 0.018, 1800);
        m.next += step; m.i++;
      }
    };
    m.timer = setInterval(tick, 60); tick();
    this.music = m;
  },
  stopMusic() { if (this.music) { clearInterval(this.music.timer); this.music = null; } },

  // spatial volume helper for other cars' sounds
  distVol(pos) {
    if (!R.camera) return 1;
    const d = R.camera.position.distanceTo(pos);
    return clamp(1 - d / 7000, 0, 1);
  },
};

<script>/* src/input.js */
'use strict';
// ============================================================================
// Input: iPad touch controls (floating stick + slide-able buttons),
// game controllers (Gamepad API) and keyboard
// ============================================================================

const Input = {
  stick: { x: 0, y: 0, id: null, ox: 0, oy: 0, cx: 0, cy: 0 },
  buttons: {}, // name -> {el, down:Set(pointerIds)}
  keys: new Set(),
  pad: null, padPrev: [],
  state: { throttle: 0, steer: 0, pitch: 0, jump: false, boost: false, handbrake: false, rollL: false, rollR: false, useItem: false },
  edges: {}, prevFlags: {},
  touchActive: false,
  layer: null,

  init() {
    this.layer = document.getElementById('touch');
    const L = this.layer;
    // floating joystick visuals
    this.stickBase = document.createElement('div'); this.stickBase.className = 'stick-base';
    this.stickKnob = document.createElement('div'); this.stickKnob.className = 'stick-knob';
    this.stickBase.appendChild(this.stickKnob); L.appendChild(this.stickBase);
    this.stickHint = document.createElement('div'); this.stickHint.className = 'stick-hint'; this.stickHint.textContent = 'DRAG TO STEER'; L.appendChild(this.stickHint);
    const defs = [
      ['jump', 'JUMP', 'btn-jump'], ['boost', 'BOOST', 'btn-boost'], ['handbrake', 'DRIFT', 'btn-drift'],
      ['rollL', '⟲', 'btn-rolll'], ['rollR', '⟳', 'btn-rollr'], ['brake', 'BRAKE', 'btn-brake'],
      ['ballcam', 'BALL<br>CAM', 'btn-ballcam'], ['useItem', 'ITEM', 'btn-item'],
    ];
    for (const [name, label, cls] of defs) {
      const el = document.createElement('div'); el.className = 'tbtn ' + cls; el.innerHTML = `<span>${label}</span>`;
      el.dataset.btn = name; L.appendChild(el);
      this.buttons[name] = { el, down: new Set() };
    }
    this.applyLayout();
    this.initGamepad();
    const opts = { passive: false };
    L.addEventListener('pointerdown', (e) => this.onDown(e), opts);
    L.addEventListener('pointermove', (e) => this.onMove(e), opts);
    L.addEventListener('pointerup', (e) => this.onUp(e), opts);
    L.addEventListener('pointercancel', (e) => this.onUp(e), opts);
    L.addEventListener('lostpointercapture', (e) => this.onUp(e), opts);
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
    window.addEventListener('blur', () => { this.keys.clear(); this.releaseAll(); });
    // stop iOS gestures
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => { if (e.target.closest && !e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
  },
  applyLayout() {
    const s = Settings.buttonSize;
    document.documentElement.style.setProperty('--btn', s.toFixed(2));
    document.documentElement.style.setProperty('--stk', Settings.stickSize.toFixed(2));
    document.body.classList.toggle('lefty', !!Settings.leftHanded);
  },
  show(on, opts) {
    this.layer.hidden = !on;
    if (!on) this.releaseAll();
    if (opts) { this.buttons.useItem.el.hidden = !opts.item; }
  },
  releaseAll() {
    for (const k in this.buttons) { this.buttons[k].down.clear(); this.buttons[k].el.classList.remove('on'); }
    this.stick.id = null; this.stick.x = this.stick.y = 0; this.stickBase.classList.remove('on');
  },
  stickSide(x) {
    const left = x < window.innerWidth * 0.45;
    return Settings.leftHanded ? !left : left;
  },
  buttonAt(x, y) {
    let best = null, bd = 1e9;
    for (const k in this.buttons) {
      const b = this.buttons[k];
      if (b.el.hidden) continue;
      const r = b.el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2 + 8;
      const d = Math.hypot(x - cx, y - cy);
      if (d < rad && d < bd) { bd = d; best = k; }
    }
    return best;
  },
  onDown(e) {
    e.preventDefault();
    this.touchActive = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (this.touchActive && this.usingPad) { this.usingPad = false; document.body.classList.remove('pad'); }
    try { this.layer.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    Sound.init();
    const btn = this.buttonAt(e.clientX, e.clientY);
    if (btn) { this.press(btn, e.pointerId); return; }
    if (this.stickSide(e.clientX) && this.stick.id === null) {
      const S = this.stick; S.id = e.pointerId; S.ox = e.clientX; S.oy = e.clientY; S.x = S.y = 0;
      this.stickBase.style.left = S.ox + 'px'; this.stickBase.style.top = S.oy + 'px';
      this.stickBase.classList.add('on'); this.stickKnob.style.transform = 'translate(-50%,-50%)';
      this.stickHint.hidden = true;
      return;
    }
    // right side empty space → jump is the most useful fallback? No: slide-assign to nearest button
    this.ptrFree = this.ptrFree || new Set(); this.ptrFree.add(e.pointerId);
  },
  onMove(e) {
    const S = this.stick;
    if (e.pointerId === S.id) {
      e.preventDefault();
      const R0 = 70 * Settings.stickSize;
      let dx = e.clientX - S.ox, dy = e.clientY - S.oy;
      const d = Math.hypot(dx, dy);
      // drag the base along when pulling past the edge (floating stick)
      if (d > R0 * 1.35) { const k = (d - R0 * 1.35) / d; S.ox += dx * k; S.oy += dy * k; dx = e.clientX - S.ox; dy = e.clientY - S.oy; this.stickBase.style.left = S.ox + 'px'; this.stickBase.style.top = S.oy + 'px'; }
      const m = Math.min(1, Math.hypot(dx, dy) / R0);
      const a = Math.atan2(dy, dx);
      S.x = Math.cos(a) * m; S.y = Math.sin(a) * m;
      const kx = clamp(dx, -R0, R0), ky = clamp(dy, -R0, R0);
      this.stickKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
      return;
    }
    // sliding between buttons
    let cur = null;
    for (const k in this.buttons) if (this.buttons[k].down.has(e.pointerId)) cur = k;
    const isFree = this.ptrFree && this.ptrFree.has(e.pointerId);
    if (!cur && !isFree) return;
    const btn = this.buttonAt(e.clientX, e.clientY);
    if (btn !== cur && btn !== 'ballcam' && cur !== 'ballcam') {
      if (cur) this.release(cur, e.pointerId);
      if (btn) { this.press(btn, e.pointerId); if (isFree) this.ptrFree.delete(e.pointerId); }
    }
  },
  onUp(e) {
    if (e.pointerId === this.stick.id) {
      this.stick.id = null; this.stick.x = this.stick.y = 0; this.stickBase.classList.remove('on');
    }
    for (const k in this.buttons) if (this.buttons[k].down.has(e.pointerId)) this.release(k, e.pointerId);
    if (this.ptrFree) this.ptrFree.delete(e.pointerId);
  },
  press(name, id) {
    const b = this.buttons[name];
    b.down.add(id); b.el.classList.add('on');
    if (name === 'ballcam') { R.cam.ballCam = !R.cam.ballCam; b.el.classList.toggle('active', R.cam.ballCam); Sound.play('click'); }
  },
  release(name, id) {
    const b = this.buttons[name];
    b.down.delete(id);
    if (!b.down.size) b.el.classList.remove('on');
  },
  held(name) { return this.buttons[name] && this.buttons[name].down.size > 0; },

  onKey(e, down) {
    const k = e.code;
    if (down && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k) && !(e.target && e.target.tagName === 'INPUT')) e.preventDefault();
    if (e.target && e.target.tagName === 'INPUT') return;
    if (down) {
      if (!this.keys.has(k)) this.keyPress(k);
      this.keys.add(k);
    } else this.keys.delete(k);
    this.touchActive = false;
  },
  keyPress(k) {
    Sound.init();
    if (k === 'KeyB' || k === 'KeyC') { R.cam.ballCam = !R.cam.ballCam; this.buttons.ballcam.el.classList.toggle('active', R.cam.ballCam); }
    if (typeof UI !== 'undefined') UI.onKey(k);
  },

  // -------------------------------------------------------------------------
  // Game controller (PS4 / PS5 / Xbox via Bluetooth). Standard mapping:
  // 0 Cross/A  1 Circle/B  2 Square/X  3 Triangle/Y  4 L1  5 R1  6 L2  7 R2
  // 8 Share  9 Options  10 L3  11 R3  12-15 D-pad up/down/left/right  16 PS  17 Touchpad
  // -------------------------------------------------------------------------
  padStatus: 'none', padName: '', usingPad: false, navT: 0, navDir: null,
  initGamepad() {
    window.addEventListener('gamepadconnected', (e) => {
      this.padName = e.gamepad.id || 'Controller';
      if (typeof UI !== 'undefined') UI.toast('🎮 ' + prettyPadName(this.padName) + ' connected');
      Sound.init();
    });
    window.addEventListener('gamepaddisconnected', () => {
      if (typeof UI !== 'undefined') UI.toast('Controller disconnected');
      if (CUR.game && !CUR.attract && !UI.screen) pauseGame();
    });
  },
  pollGamepad(dt) {
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; this.padBlocked = false; }
    catch (e) { this.padBlocked = true; pads = []; }
    let gp = null;
    for (const p of pads || []) if (p && p.connected) { gp = p; break; }
    this.pad = gp;
    if (!gp) { this.padStatus = this.padBlocked ? 'blocked' : 'none'; return; }
    this.padStatus = 'ok'; this.padName = gp.id;
    const bt = gp.buttons.map(b => b.pressed || b.value > 0.5);
    const prevBt = this.padPrev;
    const edge = (i) => bt[i] && !prevBt[i];
    const any = bt.some(Boolean) || gp.axes.some(a => Math.abs(a) > 0.4);
    if (any && !this.usingPad) { this.usingPad = true; this.touchActive = false; document.body.classList.add('pad'); Sound.init(); }
    this.padPrev = bt;
    if (typeof UI === 'undefined') return;
    const inMatch = CUR.game && !CUR.attract && !UI.screen;
    if (inMatch) {
      if (CUR.game.kind === 'freeplay') {
        const G = CUR.game;
        if (edge(12)) G.freeplayLaunch();      // D-pad up: shoot the ball at me
        if (edge(13)) G.freeplayResetBall();   // D-pad down: ball to center
        if (edge(14)) G.freeplayAerial();      // D-pad left: aerial ball
        if (edge(15)) G.freeplayWall();        // D-pad right: wall / pinch ball
        if (edge(4)) G.freeplayRewind();       // L1: rewind 3 seconds
        if (edge(5)) G.freeplayFreeze();       // R1: freeze / unfreeze the ball
        if (edge(10)) G.freeplayResetCar();    // L3: reset car
        if (edge(9)) UI.onKey('Escape');
        if (edge(3)) { R.cam.ballCam = !R.cam.ballCam; this.buttons.ballcam.el.classList.toggle('active', R.cam.ballCam); }
        return;
      }
      if (edge(3)) { R.cam.ballCam = !R.cam.ballCam; this.buttons.ballcam.el.classList.toggle('active', R.cam.ballCam); Sound.play('click'); }
      if (edge(9)) UI.onKey('Escape');
      // D-pad quick chat, laid out like Rocket League (up/left/right/down)
      if (edge(12)) UI.onKey('Digit1'); if (edge(14)) UI.onKey('Digit2'); if (edge(15)) UI.onKey('Digit3'); if (edge(13)) UI.onKey('Digit4');
      const boardBtn = !!bt[17];
      if (boardBtn !== this.padBoard) { this.padBoard = boardBtn; UI.showBoard(boardBtn); }
      if ((edge(0) || edge(1)) && CUR.game.state === 'replay') skipReplay();
      return;
    }
    // ---- menus ----
    if (UI.screen === 'title') { if (bt.some((v, i) => v && !prevBt[i])) UI.padActivate(); return; }
    if (edge(0)) UI.padActivate();
    if (edge(1)) UI.onPadB();
    if (edge(9)) UI.onKey('Escape');
    if (edge(4)) UI.padTab(-1); if (edge(5)) UI.padTab(1);
    let dx = 0, dy = 0;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (bt[14] || ax < -0.55) dx = -1; else if (bt[15] || ax > 0.55) dx = 1;
    if (bt[12] || ay < -0.55) dy = -1; else if (bt[13] || ay > 0.55) dy = 1;
    const dir = dx || dy ? dx + ',' + dy : null;
    if (dir !== this.navDir) { this.navDir = dir; this.navT = 0.38; if (dir) UI.padMove(dx, dy); }
    else if (dir) { this.navT -= dt || 0.016; if (this.navT <= 0) { this.navT = 0.11; UI.padMove(dx, dy); } }
    // right stick spins the car in the garage
    if (UI.screen === 'garage' && Math.abs(gp.axes[2] || 0) > 0.2) Garage.rot += (gp.axes[2]) * 0.06;
  },

  // compose final control state for the player's car
  read() {
    const s = this.state;
    const dz = Settings.deadzone, sens = Settings.sensitivity;
    const curve = (v) => { const a = Math.abs(v); if (a < dz) return 0; return sign(v) * clamp(((a - dz) / (1 - dz)) * sens, 0, 1); };
    let steer = curve(this.stick.x), pitch = curve(-this.stick.y);
    let throttle = 0;
    // touch throttle
    if (this.stick.id !== null || this.touchActive) {
      if (Settings.autoGas) throttle = pitch < -0.5 ? -1 : 1;
      else throttle = pitch;
    }
    if (this.held('brake')) throttle = -1;
    let jump = this.held('jump'), boost = this.held('boost'), hb = this.held('handbrake');
    let rollL = this.held('rollL'), rollR = this.held('rollR'), useItem = this.held('useItem');
    // keyboard
    const K = (c) => this.keys.has(c);
    if (this.keys.size) {
      const kx = (K('KeyD') || K('ArrowRight') ? 1 : 0) - (K('KeyA') || K('ArrowLeft') ? 1 : 0);
      const ky = (K('KeyW') || K('ArrowUp') ? 1 : 0) - (K('KeyS') || K('ArrowDown') ? 1 : 0);
      if (kx) steer = kx;
      if (ky) { pitch = ky; throttle = ky; }
      if (K('Space') || K('KeyJ')) jump = true;
      if (K('ShiftLeft') || K('ShiftRight') || K('KeyK')) boost = true;
      if (K('KeyX') || K('ControlLeft') || K('KeyL')) hb = true;
      if (K('KeyQ')) rollL = true; if (K('KeyE')) rollR = true;
      if (K('KeyF')) useItem = true;
    }
    // gamepad — Rocket League PS4 default layout
    const gp = this.pad;
    this.camYaw = 0;
    if (gp) {
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (Math.abs(ax) > dz) steer = curve(ax);
      if (Math.abs(ay) > dz) pitch = curve(-ay);
      const val = (i) => gp.buttons[i] ? Math.max(gp.buttons[i].value, gp.buttons[i].pressed ? 1 : 0) : 0;
      const rt = val(7), lt = val(6);
      if (this.usingPad || rt > 0.05 || lt > 0.05) throttle = rt > 0.05 || lt > 0.05 ? rt - lt : (this.keys.size ? throttle : 0);
      const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
      if (b(0)) jump = true;            // Cross: jump
      if (b(1)) boost = true;           // Circle: boost
      if (b(2) || b(8)) hb = true;      // Square (or SHARE): powerslide / air roll
      const fp = CUR.game && CUR.game.kind === 'freeplay';
      if (b(4) && !fp) rollL = true;    // L1: air roll left (rewind in free play)
      if (CUR.game && CUR.game.mode === 'rumble') { if (b(5)) useItem = true; } // R1: use item
      else if (b(5) && !fp) rollR = true; // R1: air roll right (freeze ball in free play)
      // right stick swivels the camera, R3 looks behind
      const rx = gp.axes[2] || 0, ry = gp.axes[3] || 0;
      if (Math.hypot(rx, ry) > 0.3) this.camYaw = Math.atan2(rx, -ry);
      if (b(11)) this.camYaw = Math.PI;
    }
    if (Settings.invertPitch) pitch = -pitch;
    s.steer = steer; s.pitch = pitch; s.throttle = throttle; s.jump = jump; s.boost = boost; s.handbrake = hb; s.rollL = rollL; s.rollR = rollR; s.useItem = useItem;
    return s;
  },
};

function prettyPadName(id) {
  const s = (id || '').toLowerCase();
  if (/dualsense/.test(s)) return 'DualSense controller';
  if (/dualshock|wireless controller|054c/.test(s)) return 'DUALSHOCK 4 controller';
  if (/xbox|045e/.test(s)) return 'Xbox controller';
  return 'Controller';
}

  hudUpdate(game, dt) {
    const H = this.hudEls, car = game.player;
    // scorebug
    if (game.kind === 'match') {
      const n = H.score.querySelectorAll('.sb-n');
      n[0].textContent = game.score[0]; n[1].textContent = game.score[1];
      const t = H.score.querySelector('.sb-time');
      t.textContent = game.mutators.matchLength === 0 ? '∞' : game.overtime ? '+' + fmtClock(game.otTime) : fmtClock(game.clock);
      H.score.classList.toggle('ot', game.overtime);
      H.score.classList.toggle('low', !game.overtime && game.clock <= 30 && game.mutators.matchLength > 0);
      H.score.querySelector('.sb-sub').textContent = game.overtime ? 'OVERTIME' : (game.zeroSecond ? '0:00 — BALL MUST HIT GROUND' : MODES[game.mode].name.toUpperCase());
    }
    // boost
    const b = Math.floor(car.boost);
    if (b !== this._lastBoost) {
      this._lastBoost = b;
      H.boost.querySelector('.bm-num').textContent = game.mutators.boost === 'unlimited' ? '∞' : String(b);
      H.boost.querySelector('.bm-fg').style.strokeDasharray = `${b * 0.75} 100`;
      H.boost.classList.toggle('empty', b === 0);
      H.boost.classList.toggle('full', b === 100);
    }
    H.boost.classList.toggle('ss', car.supersonic);
    // countdown
    if (game.state === 'countdown' && game.kind === 'match') { H.count.textContent = Math.ceil(game.stateT); H.count.classList.add('on'); }
    else if (H.count.classList.contains('on') && game.state !== 'countdown') { H.count.textContent = 'GO!'; H.count.classList.add('go'); H.count.classList.remove('on'); setTimeout(() => { H.count.classList.remove('go'); H.count.textContent = ''; }, 700); }
    // ball arrow
    const ball = game.ball;
    if (Settings.ballIndicator && !game.ballHidden && game.state !== 'replay') {
      const p = tmpV().copy(ball.pos).project(R.camera);
      const off = p.z > 1 || Math.abs(p.x) > 1 || Math.abs(p.y) > 1;
      H.arrow.hidden = !off;
      if (off) {
        let x = p.x, y = p.y; if (p.z > 1) { x = -x; y = -y; }
        const a = Math.atan2(y, x);
        const W = window.innerWidth, Hh = window.innerHeight;
        const r = Math.min(W, Hh) * 0.38;
        H.arrow.style.transform = `translate(${W / 2 + Math.cos(a) * r}px, ${Hh / 2 - Math.sin(a) * r}px) rotate(${Math.PI / 2 - a}rad)`;
      }
    } else H.arrow.hidden = true;
    // item
    if (game.mode === 'rumble') {
      const it = car.item ? RUMBLE_ITEMS[car.item] : null;
      H.item.innerHTML = it ? `<b>${it.icon}</b><span>${it.name}</span>` : '<span>Next item soon…</span>';
      H.item.classList.toggle('has', !!it);
      Input.buttons.useItem.el.classList.toggle('ready', !!it);
    }
    // training / info
    if (game.kind === 'training') H.info.textContent = `${TRAINING_PACKS[game.trainingPack].name} · Shot ${Math.min(game.trainingIdx + 1, TRAINING_PACKS[game.trainingPack].count)} / ${TRAINING_PACKS[game.trainingPack].count} · ${Math.max(0, game.trainingTimer || 0).toFixed(1)}s`;
    else if (game.kind === 'freeplay') H.info.textContent = `Free Play · ${Math.round(car.vel.length())} uu/s` + (car.supersonic ? ' · SUPERSONIC' : '');
    else H.info.textContent = '';
    H.info.hidden = !H.info.textContent;
    // fps
    H.fps.hidden = !Settings.showFps;
    if (Settings.showFps) { this._fpsAcc = (this._fpsAcc || 0) + dt; this._fpsN = (this._fpsN || 0) + 1; if (this._fpsAcc > 0.5) { H.fps.textContent = Math.round(this._fpsN / this._fpsAcc) + ' fps'; this._fpsAcc = 0; this._fpsN = 0; } }
    if (!H.board.hidden) this.renderBoard(game);
  },

  bannerShow(html, cls, dur) {
    const B = this.hudEls.banner;
    B.innerHTML = html; B.className = 'banner on ' + (cls || '');
    clearTimeout(this._bt);
    if (dur) this._bt = setTimeout(() => { B.className = 'banner'; }, dur);
  },

  award(label, pts) {
    const el = h('div', { class: 'award' }, h('b', null, label.toUpperCase()), pts ? h('span', null, '+' + pts) : null);
    this.hudEls.awards.prepend(el);
    setTimeout(() => el.classList.add('out'), 2200);
    setTimeout(() => el.remove(), 2700);
    while (this.hudEls.awards.children.length > 4) this.hudEls.awards.lastChild.remove();
  },
  feedAdd(html) {
    const el = h('div', { class: 'fitem', html });
    this.hudEls.feed.prepend(el);
    setTimeout(() => el.remove(), 5000);
    while (this.hudEls.feed.children.length > 4) this.hudEls.feed.lastChild.remove();
  },
  chatAdd(car, msg, team) {
    const el = h('div', { class: 'citem' }, h('b', { class: 't' + car.team }, (team ? '[TEAM] ' : '') + car.name + ': '), msg);
    this.hudEls.chat.append(el);
    setTimeout(() => el.classList.add('out'), 5500);
    setTimeout(() => el.remove(), 6000);
    while (this.hudEls.chat.children.length > 5) this.hudEls.chat.firstChild.remove();
  },

  toggleQuick(cat) {
    const Q = this.hudEls.quick;
    if (cat === undefined && !Q.hidden && !this._qcat) { Q.hidden = true; return; }
    Q.hidden = false; Q.innerHTML = '';
    this._qcat = cat || null;
    const close = () => { Q.hidden = true; this._qcat = null; };
    if (!cat) {
      const cats = ['Information', 'Compliments', 'Reactions', 'Apologies'];
      Q.append(h('div', { class: 'qh' }, 'Quick Chat'), ...cats.map((c, i) => h('button', { onclick: () => this.toggleQuick(c) }, `${i + 1}. ${c}`)), h('button', { class: 'qx', onclick: close }, 'Close'));
    } else {
      const list = QUICKCHAT[cat];
      Q.append(h('div', { class: 'qh' }, cat), ...list.slice(0, 8).map((m, i) => h('button', { onclick: () => { CUR.game.chat(CUR.game.player, m, cat === 'Information'); close(); } }, m)), h('button', { class: 'qx', onclick: () => this.toggleQuick() }, '‹ Back'));
    }
  },
  showBoard(on) { this.hudEls.board.hidden = !on; if (on && CUR.game) this.renderBoard(CUR.game); },
  renderBoard(g) {
    const B = this.hudEls.board;
    const rows = (t) => g.cars.filter(c => c.team === t).sort((a, b) => b.stats.score - a.stats.score).map(c =>
      `<tr class="${c === g.player ? 'me' : ''}"><td>${c.name}${c.demolished ? ' 💥' : ''}</td><td>${c.stats.score}</td><td>${c.stats.goals}</td><td>${c.stats.assists}</td><td>${c.stats.saves}</td><td>${c.stats.shots}</td><td>${c.isBot ? 'BOT' : Math.round(18 + Math.random() * 3)}</td></tr>`).join('');
    const head = (t) => `<tr><th>${TEAM_COLORS[t].name} · ${g.score[t]}</th><th>Score</th><th>Goals</th><th>Assists</th><th>Saves</th><th>Shots</th><th>Ping</th></tr>`;
    B.innerHTML = `<table class="sb t0">${head(0)}${rows(0)}</table><table class="sb t1">${head(1)}${rows(1)}</table>`;
  },

  // -------------------------------------------------------------------------
  handleEvent(ev, game) {
    const me = game.player;
    switch (ev.type) {
      case 'award': if (ev.car === me && !ev.quiet) { this.award(ev.label, ev.pts); Sound.play('award'); } break;
      case 'goal': {
        if (ev.freeplay || ev.training) { this.bannerShow(`<div class="g-big">GOAL!</div><div class="g-sub">${Math.round(ev.speed * 0.036)} KPH</div>`, 'goal t' + ev.team, 2000); break; }
        const sc = ev.scorer ? ev.scorer.name : 'Own goal';
        this.bannerShow(`<div class="g-big">GOAL!</div><div class="g-sub">${ev.ownGoal ? 'OWN GOAL' : sc}${ev.assist ? ` <small>assisted by ${ev.assist.name}</small>` : ''}</div><div class="g-speed">${Math.round(ev.speed * 0.036)} KPH</div>`, 'goal t' + ev.team, 2600);
        this.hudEls.flash.className = 'flash on t' + ev.team; setTimeout(() => this.hudEls.flash.className = 'flash', 600);
        break;
      }
      case 'replayStart': this.bannerShow('<div class="replay-tag">REPLAY</div><div class="g-sub small">Tap to skip</div>', 'replay'); break;
      case 'kickoff': if (game.kind === 'match') this.hudEls.banner.className = 'banner'; break;
      case 'overtime': this.bannerShow('<div class="g-big">OVERTIME</div><div class="g-sub">Next goal wins</div>', 'ot', 2500); break;
      case 'demo': {
        const t0 = ev.car.team, t1 = ev.victim.team;
        this.feedAdd(`<b class="t${t0}">${ev.car.name}</b> 💥 <b class="t${t1}">${ev.victim.name}</b>`);
        if (ev.victim === me) this.bannerShow('<div class="g-mid">DEMOLISHED</div><div class="g-sub">by ' + ev.car.name + '</div>', 'demo', 2200);
        break;
      }
      case 'save': this.feedAdd(`<b class="t${ev.car.team}">${ev.car.name}</b> ${ev.epic ? 'EPIC SAVE!' : 'saved it!'}`); break;
      case 'chat': {
        this.chatAdd(ev.car, ev.msg, ev.team); Sound.play('chat');
        const log = document.getElementById('postchatlog');
        if (log) { log.append(h('div', { class: 'citem' }, h('b', { class: 't' + ev.car.team }, (ev.team ? '[TEAM] ' : '') + ev.car.name + ': '), ev.msg)); log.scrollTop = 1e6; }
        break;
      }
      case 'heatlaunch': this.bannerShow(`<div class="g-mid">BALL HEADING TO ${TEAM_COLORS[ev.team].name}</div><div class="g-sub">${ev.team === me.team ? 'Defend your goal!' : 'Chase it down!'}</div>`, 'ot', 1800); break;
      case 'forfeit': this.bannerShow(`<div class="g-mid">${TEAM_COLORS[ev.team].name} FORFEITS</div><div class="g-sub">They gave up</div>`, 'ot', 3000); break;
      case 'end': {
        const won = ev.winner === me.team;
        this.bannerShow(`<div class="g-big">${won ? 'VICTORY' : 'DEFEAT'}</div><div class="g-sub">${game.score[0]} – ${game.score[1]}</div>`, 'end t' + ev.winner);
        break;
      }
      case 'itemget': if (ev.car === me) { Sound.play('item'); } break;
      case 'fptool': this.award(ev.label, 0); break;
      case 'pinch': if (ev.car === me) { this.award('Pinch! ' + Math.round(ev.speed * 0.036) + ' kph', 0); } break;
      case 'flipreset': if (ev.car === me) { this.award('Flip Reset', 0); Sound.play('flipreset'); } break;
      case 'charge': this.feedAdd(ev.level >= 2 ? 'Ball is SUPER CHARGED!' : 'Ball is CHARGED!'); break;
      case 'trainingResult': this.bannerShow(`<div class="g-mid">${ev.success ? (game.trainingPack === 'goalie' ? 'SAVED!' : 'NICE SHOT!') : (game.trainingPack === 'goalie' ? 'GOAL AGAINST' : 'MISSED')}</div>`, ev.success ? 'goal t0' : 'demo', 1800); break;
      case 'trainingShot': this.bannerShow(`<div class="g-mid">SHOT ${ev.idx + 1}</div>`, 'shot', 1200); break;
    }
  },

  onKey(k) {
    if (k === 'Escape') {
      if (this.screen === 'pause') resumeGame();
      else if (!this.screen && CUR.game && !CUR.attract) pauseGame();
      else if (this.screen && this.screen !== 'main' && this.screen !== 'title' && !CUR.game) this.show('main');
      return;
    }
    if (!CUR.game || this.screen) return;
    if (k === 'Tab') { this.showBoard(this.hudEls.board.hidden); return; }
    const m = /^Digit([1-4])$/.exec(k);
    if (m) {
      const cats = ['Information', 'Compliments', 'Reactions', 'Apologies'];
      if (this._qcat) { const msg = QUICKCHAT[this._qcat][+m[1] - 1]; CUR.game.chat(CUR.game.player, msg, this._qcat === 'Information'); this.hudEls.quick.hidden = true; this._qcat = null; }
      else this.toggleQuick(cats[+m[1] - 1]);
    }
    if (k === 'KeyR' && CUR.game.kind === 'freeplay') CUR.game.freeplayLaunch();
  },
  // ---- controller menu navigation ----
  padFocusables() {
    const list = [...this.root.querySelectorAll('button, select, input, .hbtn')].filter(el => !el.disabled && el.offsetParent !== null && !el.closest('[hidden]'));
    return list;
  },
  padFocus(el) {
    if (this._pf) this._pf.classList.remove('padfocus');
    this._pf = el;
    if (!el) return;
    el.classList.add('padfocus');
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  },
  padCurrent() {
    const list = this.padFocusables();
    if (this._pf && list.includes(this._pf)) return this._pf;
    const first = list.find(el => el.classList.contains('on') && el.classList.contains('mode')) || list.find(el => !el.classList.contains('back')) || list[0];
    this.padFocus(first || null);
    return null;
  },
  padMove(dx, dy) {
    if (this.screen === 'title') return;
    const cur = this.padCurrent();
    if (!cur) return;
    // sliders and dropdowns change value with left/right
    if (dx && cur.tagName === 'INPUT' && cur.type === 'range') {
      const st = parseFloat(cur.step) || 1;
      cur.value = clamp(parseFloat(cur.value) + dx * st, parseFloat(cur.min), parseFloat(cur.max));
      cur.dispatchEvent(new Event('input', { bubbles: true })); Sound.play('click'); return;
    }
    if (dx && cur.tagName === 'SELECT') {
      cur.selectedIndex = clamp(cur.selectedIndex + dx, 0, cur.options.length - 1);
      cur.dispatchEvent(new Event('change', { bubbles: true })); Sound.play('click'); return;
    }
    const r0 = cur.getBoundingClientRect();
    const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    let best = null, bs = 1e9;
    for (const el of this.padFocusables()) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      const ddx = x - cx, ddy = y - cy;
      const along = dx ? ddx * dx : ddy * dy;
      if (along <= 4) continue;
      const across = dx ? Math.abs(ddy) : Math.abs(ddx);
      const score = along + across * 2.5;
      if (score < bs) { bs = score; best = el; }
    }
    if (best) { this.padFocus(best); Sound.play('click'); }
  },
  padActivate() {
    if (this.screen === 'title') { Sound.init(); Sound.startMusic(); this.show('main'); return; }
    const cur = this.padCurrent();
    if (!cur) return;
    if (cur.tagName === 'SELECT') { cur.selectedIndex = (cur.selectedIndex + 1) % cur.options.length; cur.dispatchEvent(new Event('change', { bubbles: true })); return; }
    if (cur.tagName === 'INPUT') { cur.focus(); return; }
    cur.click();
  },
  padTab(d) {
    // L1 / R1 cycle garage tabs
    const tabs = [...this.root.querySelectorAll('.gtabs button')];
    if (!tabs.length) return;
    const i = tabs.findIndex(t => t.classList.contains('on'));
    tabs[(i + d + tabs.length) % tabs.length].click();
  },
  onPadA() { this.padActivate(); },
  onPadB() {
    if (this.screen === 'pause') { resumeGame(); return; }
    if (this.screen && this.screen !== 'main' && this.screen !== 'title') { const b = $('.back', this.root); if (b) b.click(); }
  },
};

function padStatusText() {
  if (Input.padStatus === 'ok') return '🎮 ' + prettyPadName(Input.padName) + ' connected';
  if (Input.padStatus === 'blocked') return '🎮 Controllers are blocked in this view';
  return '🎮 Controller: press any button on it to connect';
}
setInterval(() => { const el = document.getElementById('padstatus'); if (el) el.textContent = padStatusText(); const c = document.getElementById('cloudstatus'); if (c) c.textContent = Cloud.label(); }, 1000);

function isStandalone() { return window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }

function itemRarity(cat, k) {
  const keys = Object.keys(ITEMS[cat]);
  const i = keys.indexOf(k);
  return Math.min(RARITY.length - 1, Math.floor(i * 6 / Math.max(1, keys.length - 1) * 0.85));
}

// ---------------------------------------------------------------------------
// Garage 3D preview (separate scene, same renderer)
// ---------------------------------------------------------------------------
const Garage = {
  scene: null, cam: null, car: null, rot: 0.6, active: false,
  open() {
    this.active = true;
    if (!this.scene) {
      const s = this.scene = new THREE.Scene();
      s.background = new THREE.Color(0x0b1020);
      this.cam = new THREE.PerspectiveCamera(35, 1, 5, 5000);
      s.add(new THREE.HemisphereLight(0xcfe0ff, 0x202030, 0.55));
      const d = new THREE.DirectionalLight(0xffffff, 0.65); d.position.set(200, 300, 150); s.add(d);
      const rim = new THREE.DirectionalLight(0x6fa8ff, 0.8); rim.position.set(-300, 120, -200); s.add(rim);
      const floor = new THREE.Mesh(new THREE.CylinderGeometry(150, 160, 8, 48), new THREE.MeshStandardMaterial({ color: 0x1c2438, metalness: 0.6, roughness: 0.4 }));
      floor.position.y = -21; s.add(floor);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(155, 1.5, 6, 64), new THREE.MeshBasicMaterial({ color: 0x3d86ff })); ring.rotation.x = Math.PI / 2; ring.position.y = -17; s.add(ring);
      const grid = new THREE.GridHelper(2000, 40, 0x1d2a48, 0x141c30); grid.position.y = -25; s.add(grid);
      const el = R.renderer.domElement;
      let drag = null;
      el.addEventListener('pointerdown', (e) => { if (this.active) drag = e.clientX; });
      el.addEventListener('pointermove', (e) => { if (this.active && drag !== null) { this.rot += (e.clientX - drag) * 0.01; drag = e.clientX; } });
      window.addEventListener('pointerup', () => { drag = null; });
    }
    this.refresh();
  },
  refresh() {
    if (this.car) { this.scene.remove(this.car.group); disposeTree(this.car.group); this.scene.remove(this.car.shadow); }
    const fake = new Car(99, 0, Profile.name, false, Profile.car.body, Profile.car);
    const w = R.world; R.world = this.scene; // buildCar adds its shadow to R.world
    this.car = buildCar(fake);
    R.world = w;
    this.car.plate.visible = false;
    this.car.shadow.position.set(0, -16.5, 0);
    this.scene.add(this.car.group);
    this.fake = fake;
  },
  close() { this.active = false; },
  render(dt) {
    this.rot += dt * 0.35;
    const aspect = window.innerWidth / window.innerHeight;
    this.cam.aspect = aspect; this.cam.updateProjectionMatrix();
    const wide = aspect > 1.2;
    this.cam.position.set(Math.cos(this.rot) * 330, 110, Math.sin(this.rot) * 330);
    this.cam.lookAt(wide ? 0 : 0, wide ? 10 : -30, 0);
    if (wide) { this.cam.setViewOffset(window.innerWidth, window.innerHeight, window.innerWidth * 0.2, 0, window.innerWidth, window.innerHeight); }
    else this.cam.clearViewOffset();
    for (const wv of this.car.wheels) wv.spin.rotation.z -= dt * 2;
    R.renderer.render(this.scene, this.cam);
  },
};

</script>
<script>/* src/main.js */
'use strict';
// ============================================================================
// Boot, main loop, match lifecycle, progression
// ============================================================================

const CUR = { game: null, attract: false, paused: false, menuCam: true, acc: 0, last: 0, endT: 0 };

function boot() {
  ensureRatings();
  Cloud.init();
  Object.assign(Net.settings, Store.get('netcfg', {}));
  Net.init();
  initRenderer(document.getElementById('gl'));
  const glc = document.getElementById('gl');
  glc.addEventListener('webglcontextlost', (e) => { e.preventDefault(); }, false); // let Safari restore the GPU context instead of freezing
  if (Profile.activeMatch) { delete Profile.activeMatch; saveProfile(); setTimeout(() => UI.toast('Your last match was interrupted, so it was not counted.'), 1500); }
  Input.init();
  UI.init();
  R.cam.ballCam = Settings.ballCamDefault;
  Input.buttons.ballcam.el.classList.toggle('active', R.cam.ballCam);
  startAttract();
  UI.show('title');
  window.addEventListener('resize', () => { resizeRenderer(); });
  window.addEventListener('orientationchange', () => setTimeout(resizeRenderer, 300));
  document.addEventListener('visibilitychange', () => { if (document.hidden && CUR.game && !CUR.attract && !CUR.paused && CUR.game.kind) pauseGame(); });
  // tap during replay = skip
  document.getElementById('gl').addEventListener('pointerdown', skipReplay);
  document.getElementById('touch').addEventListener('pointerdown', (e) => { if (CUR.game && CUR.game.state === 'replay') skipReplay(); });
  requestAnimationFrame(loop);
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ screen: UI.screen }));
}

function skipReplay() {
  const g = CUR.game;
  if (g && !CUR.attract && g.state === 'replay') { g.finishReplay(); UI.hudEls.banner.className = 'banner'; }
}

function startAttract() {
  CUR.attract = true; CUR.menuCam = true; CUR.paused = false;
  const g = new Game({ kind: 'match', mode: 'soccar', teamSize: 2, level: 'allstar', map: 'auto', attract: true, replays: false, mutators: { matchLength: 0 } });
  CUR.game = g;
  buildWorld(g);
  UI.showHud(false, g);
  Input.show(false);
  Sound.setCrowd(0.4);
}

function startMatch(cfg) {
  cfg = JSON.parse(JSON.stringify(cfg));
  if (cfg.kind === 'match' && cfg.competitive) cfg.mutators = {};
  if (cfg.kind === 'match') { const r = matchRating(cfg); cfg.botRating = r != null ? r : undefined; }
  Garage.close();
  const g = new Game(cfg);
  CUR.game = g; CUR.attract = false; CUR.menuCam = false; CUR.paused = false; CUR.acc = 0; CUR.endT = 0;
  buildWorld(g);
  R.cam.init = false;
  R.cam.ballCam = Settings.ballCamDefault;
  Input.buttons.ballcam.el.classList.toggle('active', R.cam.ballCam);
  // place the camera behind the player right away
  const f = g.player.fwd(new V3());
  R.cam.dir.copy(f); R.cam.pos.copy(g.player.pos).addScaledVector(f, -400).add(new V3(0, 150, 0)); R.cam.up.set(0, 1, 0);
  UI.show(null);
  UI.showHud(true, g);
  Input.show(true, { item: g.mode === 'rumble' });
  Sound.init(); Sound.stopMusic(); Sound.setCrowd(g.kind === 'match' ? 0.6 : 0.15);
  requestWakeLock();
  if (g.kind === 'match') { Profile.activeMatch = { mode: g.mode, size: g.cfg.teamSize, ranked: !!g.cfg.competitive, at: Date.now() }; saveProfile(); }
}

// keep the iPad screen awake during matches
let _wakeLock = null;
function requestWakeLock() {
  try {
    if (navigator.wakeLock && !_wakeLock) navigator.wakeLock.request('screen').then(l => { _wakeLock = l; l.addEventListener('release', () => { _wakeLock = null; }); }).catch(() => {});
  } catch (e) { /* unsupported */ }
}

function pauseGame() {
  if (!CUR.game || CUR.attract || CUR.game.state === 'ended') return;
  CUR.paused = true;
  Input.show(false);
  UI.show('pause');
}
function resumeGame() {
  CUR.paused = false;
  UI.show(null);
  Input.show(true, { item: CUR.game.mode === 'rumble' });
}
function quitToMenu(screen) {
  if (Profile.activeMatch) { delete Profile.activeMatch; saveProfile(); }
  // leaving a ranked match early counts as a loss
  const g = CUR.game;
  if (g && !CUR.attract && g.online) { Net.leaveMatch(g); if (!screen) screen = Net.inParty() ? 'party' : 'main'; }
  if (g && !CUR.attract && g.kind === 'match' && g.cfg.competitive && g.state !== 'ended') {
    const res = applyRatingResult(g.cfg, false, -3);
    g.player.stats && Profile.losses++;
    saveProfile();
    if (res) setTimeout(() => UI.toast(`Forfeit — counted as a loss (${res.delta} MMR)`), 300);
  }
  startAttract();
  Sound.startMusic();
  UI.show(screen || 'main');
}

function applySettings(rebuild) {
  Sound.applyVolumes();
  Input.applyLayout();
  setFov();
  if (rebuild) {
    const q = qualityLevel();
    R.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q >= 2 ? 1.6 : q === 1 ? 1.2 : 0.85));
    resizeRenderer();
  }
}

// ---------------------------------------------------------------------------
function loop(t) {
  requestAnimationFrame(loop);
  const now = t / 1000;
  let dt = CUR.last ? now - CUR.last : 1 / 60;
  CUR.last = now;
  dt = Math.min(dt, 0.1);
  const g = CUR.game;

  Input.pollGamepad(dt);
  if (UI.screen === 'garage' && Garage.active) { Garage.render(dt); return; }

  // online matches keep running behind the pause menu (the others are still playing)
  if (g && (!CUR.paused || g.online)) {
    const ctrlIn = (!CUR.attract && !UI.screen) ? Input.read() : null;
    if (!ctrlIn && g.online && !g.player.isBot) g.player.ctrl = newControls();
    CUR.acc += Math.min(dt, 0.05);
    let steps = 0;
    while (CUR.acc >= PHYS.TICK && steps < 8) {
      if (ctrlIn && !g.player.isBot) Object.assign(g.player.ctrl, ctrlIn);
      try { g.update(PHYS.TICK); } catch (e) { console.error(e); }
      CUR.acc -= PHYS.TICK; steps++;
    }
    if (steps >= 8) CUR.acc = 0;
    try { Net.tick(g, dt); } catch (e) { console.error(e); }
    // a glitch in effects or the HUD must never stop the match from finishing
    try { processEvents(g); } catch (e) { console.error(e); }
    if (!CUR.attract) {
      try { UI.hudUpdate(g, dt); } catch (e) { console.error(e); }
      if (g.state === 'ended' && g.kind === 'training' && !UI.screen) {
        CUR.endT += dt;
        if (CUR.endT > 1.5) { Input.show(false); UI.showHud(false, g); UI.show('trainingEnd', { results: g.trainingResults }); }
      }
    } else if (g.state === 'ended' || g.time > 600) startAttract();
    try { Sound.updateCar(g.player, !CUR.attract && !UI.screen && g.state !== 'replay'); } catch (e) { /* audio is optional */ }
  } else try { Sound.updateCar(null, false); } catch (e) { /* audio is optional */ }
  if (g && !CUR.attract && g.state === 'ended' && g.kind === 'match') endOfMatch(g, dt);

  let replayFrame = null;
  if (g && g.state === 'replay') {
    const snap = g.replay.snap;
    const i = Math.floor(g.replay.t * 30);
    if (i >= snap.length - 1) { g.finishReplay(); UI.hudEls.banner.className = 'banner'; }
    else replayFrame = lerpFrame(snap[i], snap[i + 1], g.replay.t * 30 - i);
  }
  if (g) {
    CUR.menuCam = CUR.attract;
    if (CUR.attract) attractCamera(dt, g); else updateCamera(dt, g, replayFrame);
    renderFrame(dt, g, replayFrame);
  }
}

function lerpFrame(a, b, t) {
  const L = (x, y) => x + (y - x) * t;
  const qa = new Q4(), qb = new Q4();
  const f = { b: a.b.slice(), c: [] };
  for (let k = 0; k < 3; k++) f.b[k] = L(a.b[k], b.b[k]);
  qa.set(a.b[3], a.b[4], a.b[5], a.b[6]); qb.set(b.b[3], b.b[4], b.b[5], b.b[6]); qa.slerp(qb, t); f.b[3] = qa.x; f.b[4] = qa.y; f.b[5] = qa.z; f.b[6] = qa.w;
  for (let i = 0; i < a.c.length; i++) {
    const ca = a.c[i], cb = b.c[i], c = ca.slice();
    for (let k = 0; k < 3; k++) c[k] = L(ca[k], cb[k]);
    qa.set(ca[3], ca[4], ca[5], ca[6]); qb.set(cb[3], cb[4], cb[5], cb[6]); qa.slerp(qb, t); c[3] = qa.x; c[4] = qa.y; c[5] = qa.z; c[6] = qa.w;
    c[10] = L(ca[10], cb[10]);
    f.c.push(c);
  }
  return f;
}

// cinematic camera for the menu attract mode
function attractCamera(dt, g) {
  const C = R.cam, cam = R.camera;
  const b = g.ball.pos;
  const a = R.time * 0.07;
  const want = tmpV(b.x * 0.4 + Math.cos(a) * 2600, 700 + Math.sin(a * 0.7) * 250, b.z * 0.6 + Math.sin(a) * 3200);
  keepInArena(want, 100);
  C.pos.lerp(want, damp(0.8, dt)); C.look.lerp(tmpV().copy(b).setY(Math.min(b.y, 600)), damp(2, dt));
  cam.position.copy(C.pos); cam.up.set(0, 1, 0); cam.lookAt(C.look);
}

// ---------------------------------------------------------------------------
function processEvents(g) {
  const evs = g.events; g.events = [];
  const me = g.player;
  const live = !CUR.attract;
  for (const ev of evs) {
    FX.handle(ev, g);
    if (live) UI.handleEvent(ev, g);
    const v = ev.car && ev.car !== me ? Sound.distVol(ev.car.pos) : 1;
    if (!live) { if (ev.type === 'goal') Sound.cheer(0.4, 2); continue; }
    switch (ev.type) {
      case 'hit': Sound.play('hit', { s: ev.strength / 2000, vol: Sound.distVol(ev.pos) * 0.7 + 0.3 }); if (ev.strength > 2500) Sound.cheer(0.25, 0.8); break;
      case 'bounce': Sound.play('bounce', { vol: clamp(ev.strength / 1500, 0, 1) * Sound.distVol(ev.pos) }); break;
      case 'jump': case 'doublejump': Sound.play('jump', { vol: v }); break;
      case 'dodge': Sound.play('dodge', { vol: v }); break;
      case 'land': if (ev.car === me && ev.impact < -300) Sound.play('land', { vol: clamp(-ev.impact / 1200, 0, 1) }); break;
      case 'pad': if (ev.car === me) Sound.play(ev.pad.big ? 'padBig' : 'padSmall'); break;
      case 'demo': Sound.play('demo', { vol: Math.max(v, Sound.distVol(ev.pos)) }); Sound.cheer(0.4, 1.2); break;
      case 'bump': Sound.play('bump', { vol: v }); break;
      case 'pinch': Sound.play('hit', { s: 1.5 }); Sound.play('whoosh'); Sound.cheer(0.6, 1.2); break;
      case 'fptool': Sound.play('click'); break;
      case 'goal': Sound.play('horn'); Sound.cheer(1, 4); break;
      case 'count': Sound.play('count'); break;
      case 'go': Sound.play('go'); break;
      case 'save': Sound.cheer(0.7, 1.5); break;
      case 'itemuse': Sound.play('itemuse', { vol: v }); break;
      case 'tiles': Sound.play('tile'); break;
      case 'end': Sound.play('horn'); Sound.cheer(0.8, 4); break;
      case 'trainingResult': Sound.play(ev.success ? 'levelup' : 'back'); break;
    }
  }
}

// match end → post-match screen (runs even while paused, and survives errors)
function endOfMatch(g, dt) {
  CUR.endT += dt;
  // save the result the moment the match ends, so nothing can lose it
  if (!g.result) {
    try { g.result = finishMatchProgress(g); } catch (e) { console.error(e); g.result = { game: g, xp: 0, xpFrom: 0, xpTo: 0, leveled: false, drops: [], rating: null }; }
    Input.show(false);
  }
  if (CUR.endT > 2.5 && UI.screen !== 'post') {
    CUR.paused = false;
    try { UI.showHud(false, g); } catch (e) { console.error(e); }
    try { UI.show('post', g.result); } catch (e) {
      console.error(e);
      // fall back to a bare post screen without the extras
      try { UI.show('post', { game: g, xp: g.result.xp || 0, xpFrom: 0, xpTo: 0, leveled: false, drops: [], rating: null }); } catch (e2) { console.error(e2); startAttract(); UI.show('main'); }
    }
    try { Sound.startMusic(); } catch (e) { /* audio is optional */ }
  }
}

// ---------------------------------------------------------------------------
// Progression: XP, levels, item drops, competitive rating, career stats
// ---------------------------------------------------------------------------
function finishMatchProgress(g) {
  const P = Profile, me = g.player;
  delete P.activeMatch;
  const won = g.winner === me.team;
  // the win/loss and rank change are recorded and saved first, before anything optional
  const goalDiff = g.score[me.team] - g.score[1 - me.team];
  let rating = null;
  try { rating = applyRatingResult(g.cfg, won, goalDiff); } catch (e) { console.error(e); }
  if (won) P.wins = (P.wins || 0) + 1; else P.losses = (P.losses || 0) + 1;
  P.goals = (P.goals || 0) + me.stats.goals; P.assists = (P.assists || 0) + me.stats.assists;
  P.saves = (P.saves || 0) + me.stats.saves; P.demos = (P.demos || 0) + me.stats.demos;
  if (g.mvp === me) P.mvps = (P.mvps || 0) + 1;
  saveProfile();
  // XP, levels and item drops
  if (!(P.level >= 1)) P.level = 1;
  if (!isFinite(P.xp)) P.xp = 0;
  const xpFrom = Math.min(100, P.xp / xpForLevel(P.level) * 100);
  const xp = Math.round(150 + me.stats.score * 0.6 + (won ? 150 : 0) + (g.mvp === me ? 75 : 0));
  let leveled = false;
  const drops = [];
  try {
    P.xp += xp;
    while (P.xp >= xpForLevel(P.level)) {
      P.xp -= xpForLevel(P.level); P.level++; leveled = true;
      const d = rollDrop(); if (d) drops.push(d);
    }
    if (won && Math.random() < 0.35) { const d = rollDrop(); if (d) drops.push(d); }
  } catch (e) { console.error(e); }
  saveProfile();
  if (leveled) try { Sound.play('levelup'); } catch (e) { /* audio is optional */ }
  const xpTo = Math.min(100, P.xp / xpForLevel(P.level) * 100);
  return { game: g, xp, xpFrom: leveled ? 0 : xpFrom, xpTo, leveled, drops, rating };
}

function rollDrop() {
  const P = Profile;
  const locked = [];
  for (const cat of Object.keys(ITEMS)) for (const k of Object.keys(ITEMS[cat])) if (!(P.unlocked[cat] || []).includes(k)) locked.push([cat, k]);
  if (!locked.length) return null;
  // rarer items are less likely
  const weighted = locked.map(([c, k]) => ({ c, k, w: 1 / (1 + itemRarity(c, k)) }));
  let r = Math.random() * weighted.reduce((a, b) => a + b.w, 0);
  let pickd = weighted[0];
  for (const it of weighted) { r -= it.w; if (r <= 0) { pickd = it; break; } }
  (P.unlocked[pickd.c] = P.unlocked[pickd.c] || []).push(pickd.k);
  (P.newItems = P.newItems || []).push(pickd.c + ':' + pickd.k);
  const catNames = { body: 'Car', decal: 'Decal', wheels: 'Wheels', boost: 'Boost', explosion: 'Goal Explosion', topper: 'Topper', antenna: 'Antenna' };
  return { name: ITEMS[pickd.c][pickd.k], rarity: itemRarity(pickd.c, pickd.k), catName: catNames[pickd.c] };
}

window.addEventListener('load', boot);

</script>
