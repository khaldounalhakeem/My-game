<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boost League">
<meta name="theme-color" content="#070b16">
<title>Boost League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Russo+One&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD + touch layer + menu layer stacked above.
   Single deliberate dark "night stadium" look — floodlit navy, team blue/orange, boost amber. */
:root {
  --ink: #eaf1ff;
  --ink-dim: #9fb0cf;
  --night: #070b16;
  --panel: rgba(12, 20, 40, 0.82);
  --panel-edge: rgba(120, 160, 255, 0.22);
  --blue: #3d86ff;
  --orange: #ff8a2b;
  --amber: #ffc23a;
  --good: #5ee08a;
  --bad: #ff5a5a;
  --f-display: 'Russo One', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  --f-ui: 'Chakra Petch', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --btn: 1;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --st: env(safe-area-inset-top, 0px);
  --sbm: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--f-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
input, select { -webkit-user-select: text; user-select: text; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ---------------- menus ---------------- */
#ui { position: fixed; inset: 0; z-index: 30; overflow: hidden; }
#ui > * { animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.menu { position: absolute; inset: 0; padding: calc(24px + var(--st)) calc(28px + var(--sr)) calc(24px + var(--sbm)) calc(28px + var(--sl));
  background: linear-gradient(100deg, rgba(5, 9, 20, 0.92) 0%, rgba(5, 9, 20, 0.7) 45%, rgba(5, 9, 20, 0.15) 100%); display: flex; flex-direction: column; gap: 16px; }
.menu.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.mhead { display: flex; align-items: center; gap: 16px; }
.mhead h2 { margin: 0; font-family: var(--f-display); font-size: clamp(26px, 4vw, 40px); letter-spacing: .02em; font-style: italic; text-transform: uppercase; }
h3 { margin: 18px 0 4px; font-family: var(--f-display); font-weight: 400; letter-spacing: .12em; font-size: 14px; color: var(--amber); text-transform: uppercase; }
.back { background: none; border: 1px solid var(--panel-edge); color: var(--ink-dim); padding: 8px 14px; border-radius: 4px; font-size: 15px; }

.logo { font-family: var(--f-display); font-style: italic; line-height: .85; display: flex; flex-direction: column; text-transform: uppercase; filter: drop-shadow(0 6px 24px rgba(0,0,0,.6)); }
.logo .l1 { font-size: clamp(64px, 13vw, 150px); color: #fff; letter-spacing: -.01em; }
.logo .l2 { font-size: clamp(40px, 8vw, 92px); background: linear-gradient(90deg, var(--blue), #9a7dff 50%, var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-left: .45em; }
.logo.small .l1 { font-size: clamp(38px, 6vw, 64px); }
.logo.small .l2 { font-size: clamp(24px, 3.6vw, 40px); }

.title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 calc(8vw + var(--sl)); gap: 18px;
  background: radial-gradient(ellipse at 20% 50%, rgba(5,9,20,.75), rgba(5,9,20,.2) 70%); }
.tagline { font-size: clamp(15px, 2vw, 20px); color: var(--ink-dim); letter-spacing: .06em; }
.press { margin-top: 30px; font-family: var(--f-display); font-size: 22px; letter-spacing: .3em; color: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.title-hint { position: absolute; bottom: calc(18px + var(--sbm)); left: calc(8vw + var(--sl)); color: var(--ink-dim); font-size: 13px; }

.main-menu { justify-content: center; }
.mlist { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
.mbtn { position: relative; text-align: left; border: 0; padding: 12px 22px; background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
  transform: skewX(-10deg); border-left: 4px solid var(--blue); display: flex; align-items: baseline; gap: 14px; transition: background .15s, border-color .15s, transform .15s; }
.mbtn > * { transform: skewX(10deg); }
.mbtn .mbtn-label { font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 24px); letter-spacing: .04em; }
.mbtn small { color: var(--ink-dim); font-size: 13px; }
.mbtn:hover, .mbtn:active { background: linear-gradient(90deg, rgba(61,134,255,.4), rgba(61,134,255,.05)); border-left-color: var(--amber); transform: skewX(-10deg) translateX(6px); }
.mbtn.big .mbtn-label { font-size: clamp(26px, 3.6vw, 36px); }
.mbtn.big { border-left-color: var(--orange); }
.mbtn.go { background: linear-gradient(90deg, #ff9a3a, #ff6a1a); border-left-color: #fff; color: #1a0d00; padding: 14px 34px; }
.mbtn.go small { color: #3a1d00; }

.pcard { position: absolute; right: calc(28px + var(--sr)); bottom: calc(24px + var(--sbm)); width: 260px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
.pc-name { font-family: var(--f-display); font-size: 22px; }
.pc-title { font-size: 12px; letter-spacing: .2em; color: var(--amber); }
.pc-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-dim); }
.pc-new { font-size: 13px; color: var(--good); }
.xpbar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), #9a7dff); transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
.xpbar.big { height: 12px; width: min(520px, 100%); }

.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.mode { text-align: left; padding: 14px 16px; background: rgba(255,255,255,.05); border: 1px solid var(--panel-edge); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 96px; }
.mode b { font-family: var(--f-display); font-weight: 400; font-size: 20px; font-style: italic; }
.mode small { color: var(--ink-dim); font-size: 13px; line-height: 1.35; }
.mode.on { border-color: var(--amber); background: rgba(255,194,58,.12); box-shadow: inset 0 0 0 1px var(--amber); }
.opts { display: flex; flex-wrap: wrap; gap: 14px 26px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .mut label, .setrow label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.seg { display: inline-flex; border: 1px solid var(--panel-edge); border-radius: 5px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: rgba(255,255,255,.04); border: 0; padding: 9px 14px; font-size: 15px; border-right: 1px solid var(--panel-edge); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--blue); color: #fff; }
select, input[type=text], input:not([type]) { background: #101a33; color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 5px; padding: 9px 10px; font: inherit; font-size: 15px; max-width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.ghost { background: none; border: 1px dashed var(--panel-edge); border-radius: 5px; padding: 8px 14px; color: var(--ink-dim); }
.mutators { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 12px; background: rgba(255,255,255,.03); border-radius: 6px; }
.mut { display: flex; flex-direction: column; gap: 4px; }
.go-row { margin-top: auto; padding-top: 8px; }

.howto dl { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 10px 22px; margin: 0; max-width: 980px; }
.howto dt { font-family: var(--f-display); color: var(--amber); font-size: 15px; letter-spacing: .03em; }
.howto dd { margin: 0; color: var(--ink); line-height: 1.45; font-size: 15px; max-width: 65ch; }
@media (max-width: 640px) { .howto dl { grid-template-columns: 1fr; } }

.settings { max-width: 100%; }
.setrow { display: grid; grid-template-columns: minmax(140px, 260px) minmax(0, 1fr) 64px; gap: 14px; align-items: center; max-width: 760px; }
.setrow input[type=range] { width: 100%; accent-color: var(--amber); }
.setrow select, .setrow .tog { grid-column: 2 / 4; justify-self: start; }
.sval { font-variant-numeric: tabular-nums; color: var(--ink-dim); text-align: right; }
.tog { min-width: 64px; padding: 7px 12px; border-radius: 16px; border: 1px solid var(--panel-edge); background: rgba(255,255,255,.05); }
.tog.on { background: var(--good); color: #062010; border-color: var(--good); }

.rankcard { padding: 16px 20px; border-radius: 6px; background: linear-gradient(110deg, rgba(61,134,255,.25), rgba(154,125,255,.15)); border: 1px solid var(--panel-edge); max-width: 520px; }
.rk-name { font-family: var(--f-display); font-size: 30px; font-style: italic; }
.rk-mmr, .rk-lvl { color: var(--ink-dim); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-width: 760px; }
.stat { padding: 12px; background: rgba(255,255,255,.05); border-radius: 6px; display: flex; flex-direction: column; }
.stat b { font-family: var(--f-display); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-dim); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }

.pause { align-items: center; justify-content: center; background: rgba(5,9,20,.78); }
.pause h2 { font-family: var(--f-display); font-size: 40px; margin: 0 0 6px; font-style: italic; }

/* post-match */
.post { align-items: center; background: rgba(5,9,20,.85); }
.result { font-family: var(--f-display); font-size: clamp(48px, 8vw, 88px); font-style: italic; letter-spacing: .02em; }
.result.win { color: var(--amber); text-shadow: 0 0 40px rgba(255,194,58,.4); }
.result.loss { color: var(--ink-dim); }
.mvp { font-size: 18px; color: var(--ink); letter-spacing: .1em; }
.sbs { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
table.sb { border-collapse: collapse; min-width: min(420px, 100%); background: rgba(255,255,255,.04); font-variant-numeric: tabular-nums; }
table.sb th, table.sb td { padding: 7px 10px; text-align: right; font-size: 14px; }
table.sb th:first-child, table.sb td:first-child { text-align: left; min-width: 130px; }
table.sb.t0 th { background: rgba(61,134,255,.55); }
table.sb.t1 th { background: rgba(255,138,43,.55); }
table.sb tr.me td { background: rgba(255,194,58,.16); }
.xpwrap { display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, 100%); }
.lvlup { color: var(--amber); }
.mmr { color: var(--ink-dim); }
.drops { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.drops-h { font-family: var(--f-display); letter-spacing: .2em; color: var(--amber); }
.drop { padding: 10px 14px; border: 1px solid var(--rar); border-radius: 6px; background: rgba(0,0,0,.35); box-shadow: 0 0 22px -6px var(--rar); display: flex; flex-direction: column; animation: dropIn .6s cubic-bezier(.2,1.4,.4,1); }
.drop small { color: var(--rar); }
@keyframes dropIn { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
.tshots { display: flex; gap: 8px; }
.tshots span { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; font-family: var(--f-display); }
.tshots .ok { background: var(--good); color: #052010; }
.tshots .bad { background: rgba(255,90,90,.25); color: var(--bad); }

/* garage */
.garage { position: absolute; inset: 0; pointer-events: none; padding: calc(20px + var(--st)) calc(20px + var(--sr)) calc(20px + var(--sbm)) calc(20px + var(--sl)); }
.garage > * { pointer-events: auto; }
.garage .mhead { position: absolute; top: calc(20px + var(--st)); left: calc(20px + var(--sl)); }
.gpanel { position: absolute; top: calc(20px + var(--st)); right: calc(20px + var(--sr)); bottom: calc(20px + var(--sbm)); width: min(440px, 46vw); background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.gtabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px solid var(--panel-edge); }
.gtabs button { background: rgba(255,255,255,.05); border: 0; padding: 7px 10px; border-radius: 4px; font-size: 13px; }
.gtabs button.on { background: var(--blue); }
.ggrid { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; align-content: start; }
.gitem { position: relative; text-align: left; padding: 10px; min-height: 64px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-bottom: 3px solid var(--rar, #888); border-radius: 5px; display: flex; flex-direction: column; gap: 4px; }
.gitem small { color: var(--rar, var(--ink-dim)); font-size: 11px; }
.gitem.on { outline: 2px solid var(--amber); background: rgba(255,194,58,.12); }
.gitem.locked { opacity: .45; }
.gitem em { position: absolute; top: 6px; right: 6px; font-style: normal; font-size: 10px; background: var(--good); color: #052010; padding: 1px 5px; border-radius: 3px; }
.gitem .sw { width: 100%; height: 22px; border-radius: 3px; display: block; }
.ghint { position: absolute; left: calc(24px + var(--sl)); bottom: calc(20px + var(--sbm)); color: var(--ink-dim); font-size: 13px; pointer-events: none; }
@media (max-aspect-ratio: 6/5) { .gpanel { top: 52%; width: auto; left: calc(20px + var(--sl)); } }

.toast { position: fixed; left: 50%; bottom: calc(40px + var(--sbm)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--panel-edge); padding: 10px 18px; border-radius: 6px; z-index: 60; transition: opacity .5s; }
.toast.out { opacity: 0; }

/* ---------------- HUD ---------------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud button { pointer-events: auto; }
.scorebug { position: absolute; top: calc(10px + var(--st)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; font-family: var(--f-display); filter: drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
.sb-team { width: 74px; display: grid; place-items: center; font-size: 34px; transform: skewX(-12deg); }
.sb-team span { transform: skewX(12deg); }
.sb-team.b { background: linear-gradient(180deg, #4b93ff, #1f5fd6); }
.sb-team.o { background: linear-gradient(180deg, #ff9a45, #e2620e); }
.sb-clock { background: rgba(8,12,26,.88); padding: 4px 18px 6px; min-width: 120px; display: flex; flex-direction: column; align-items: center; }
.sb-time { font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sb-sub { font-family: var(--f-ui); font-size: 10px; letter-spacing: .18em; color: var(--ink-dim); white-space: nowrap; }
.scorebug.low .sb-time { color: #ff6b6b; }
.scorebug.ot .sb-time { color: var(--amber); }

.boostmeter { position: absolute; right: calc(26px + var(--sr)); bottom: calc(340px * var(--btn) + var(--sbm)); width: 112px; height: 112px; }
body.lefty .boostmeter { right: auto; left: calc(26px + var(--sl)); }
.bm-ring svg { width: 100%; height: 100%; transform: rotate(135deg); }
.bm-ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.bm-bg { stroke: rgba(0,0,0,.45); stroke-dasharray: 75 100; }
.bm-fg { stroke: var(--amber); stroke-dasharray: 25 100; transition: stroke-dasharray .12s; filter: drop-shadow(0 0 6px rgba(255,170,40,.8)); }
.bm-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 40px; text-shadow: 0 2px 8px rgba(0,0,0,.7); padding-bottom: 6px; font-variant-numeric: tabular-nums; }
.bm-lbl { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; letter-spacing: .25em; color: var(--ink-dim); }
.boostmeter.empty .bm-num { color: var(--ink-dim); }
.boostmeter.full .bm-fg { stroke: #ffe27a; }
.boostmeter.ss .bm-lbl { color: #fff; }

.countdown { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-size: 0; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.6); transition: transform .2s; }
.countdown.on { font-size: clamp(90px, 16vw, 170px); animation: countPop 1s ease-out infinite; }
.countdown.go { font-size: clamp(90px, 16vw, 170px); color: var(--amber); animation: goOut .7s ease-out forwards; }
@keyframes countPop { 0% { transform: scale(1.4); opacity: 0; } 20% { transform: scale(1); opacity: 1; } }
@keyframes goOut { to { transform: scale(1.8); opacity: 0; } }

.banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; opacity: 0; transform: scale(.8); transition: opacity .25s, transform .25s cubic-bezier(.2,1.4,.4,1); }
.banner.on { opacity: 1; transform: none; }
.g-big { font-family: var(--f-display); font-style: italic; font-size: clamp(72px, 13vw, 150px); line-height: .95; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
.g-mid { font-family: var(--f-display); font-style: italic; font-size: clamp(40px, 7vw, 76px); text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.g-sub { font-size: clamp(18px, 2.4vw, 26px); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
.g-sub.small { font-size: 14px; color: var(--ink-dim); }
.g-sub small { font-size: .6em; color: var(--ink-dim); }
.g-speed { font-family: var(--f-display); color: var(--amber); font-size: 22px; margin-top: 4px; }
.banner.t0 .g-big { color: #8fbcff; }
.banner.t1 .g-big { color: #ffbe86; }
.banner.ot .g-big { color: var(--amber); }
.banner.demo .g-mid { color: #ff7b6b; }
.banner.replay { top: auto; bottom: calc(26px + var(--sbm)); }
.replay-tag { display: inline-block; font-family: var(--f-display); font-size: 30px; letter-spacing: .3em; padding: 6px 22px; background: rgba(200,30,30,.85); transform: skewX(-12deg); }
.flash { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; }
.flash.on { opacity: .45; transition: none; }
.flash.t0 { background: radial-gradient(circle, rgba(61,134,255,.9), transparent 70%); }
.flash.t1 { background: radial-gradient(circle, rgba(255,138,43,.9), transparent 70%); }

.awards { position: absolute; right: calc(24px + var(--sr)); top: calc(110px + var(--st)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
body.lefty .awards { right: auto; left: calc(24px + var(--sl)); align-items: flex-start; }
.award { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; background: linear-gradient(90deg, rgba(8,12,26,.2), rgba(8,12,26,.85)); border-right: 3px solid var(--amber); animation: awardIn .35s cubic-bezier(.2,1.4,.4,1); transition: opacity .5s, transform .5s; }
.award b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .04em; }
.award span { color: var(--amber); font-family: var(--f-display); }
.award.out { opacity: 0; transform: translateX(30px); }
@keyframes awardIn { from { transform: translateX(60px); opacity: 0; } }

.feed { position: absolute; right: calc(16px + var(--sr)); top: calc(12px + var(--st)); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-size: 14px; }
.fitem { background: rgba(8,12,26,.75); padding: 4px 10px; border-radius: 3px; }
b.t0, .t0 > b { color: #8fbcff; } b.t1 { color: #ffbe86; }
.chatfeed { position: absolute; left: calc(16px + var(--sl)); top: calc(70px + var(--st)); display: flex; flex-direction: column; gap: 3px; font-size: 14px; max-width: 40vw; }
.citem { background: rgba(8,12,26,.6); padding: 3px 10px; border-radius: 3px; transition: opacity .5s; }
.citem.out { opacity: 0; }
.ballarrow { position: absolute; left: 0; top: 0; color: #fff; font-size: 30px; text-shadow: 0 0 8px rgba(0,0,0,.9); margin: -15px 0 0 -10px; opacity: .85; }
.itemslot { position: absolute; right: calc(186px * var(--btn) + var(--sr)); bottom: calc(272px * var(--btn) + var(--sbm)); display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(8,12,26,.7); border-radius: 18px; font-size: 13px; color: var(--ink-dim); }
.itemslot.has { color: #fff; border: 1px solid var(--amber); }
.itemslot b { font-size: 22px; }
.fps { position: absolute; left: calc(14px + var(--sl)); bottom: calc(8px + var(--sbm)); font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.infobar { position: absolute; top: calc(12px + var(--st)); left: 50%; transform: translateX(-50%); background: rgba(8,12,26,.75); padding: 6px 16px; border-radius: 4px; font-size: 14px; letter-spacing: .06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.topbtns { position: absolute; left: calc(12px + var(--sl)); top: calc(10px + var(--st)); display: flex; gap: 8px; }
.hbtn { min-width: 46px; height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(8,12,26,.6); font-size: 18px; display: grid; place-items: center; padding: 0 10px; }
.hbtn.wide { font-size: 13px; }
.fpbtns { position: absolute; left: calc(12px + var(--sl)); top: calc(66px + var(--st)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.quick { position: absolute; left: calc(12px + var(--sl)); top: calc(66px + var(--st)); width: 240px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
.quick .qh { font-family: var(--f-display); font-size: 14px; letter-spacing: .1em; color: var(--amber); padding: 4px 6px; }
.quick button { text-align: left; background: rgba(255,255,255,.05); border: 0; padding: 9px 10px; border-radius: 4px; font-size: 15px; }
.quick .qx { color: var(--ink-dim); }
.board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 10px; background: rgba(5,9,20,.85); padding: 16px; border-radius: 8px; }

/* ---------------- touch controls ---------------- */
#touch { position: fixed; inset: 0; z-index: 20; touch-action: none; }
.stick-base { position: absolute; width: calc(140px * var(--stk, 1)); height: calc(140px * var(--stk, 1)); margin: calc(-70px * var(--stk, 1)) 0 0 calc(-70px * var(--stk, 1)); border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35); background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.02)); opacity: 0; transition: opacity .15s; pointer-events: none; }
.stick-base.on { opacity: 1; }
.stick-knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 0 18px rgba(255,255,255,.35); transform: translate(-50%,-50%); }
.stick-hint { position: absolute; left: calc(12vw + var(--sl)); bottom: calc(18vh + var(--sbm)); font-size: 13px; letter-spacing: .25em; color: rgba(255,255,255,.55); border: 1px dashed rgba(255,255,255,.3); padding: 34px 26px; border-radius: 50%; pointer-events: none; }
body.lefty .stick-hint { left: auto; right: calc(12vw + var(--sr)); }
.tbtn { position: absolute; right: calc(var(--x) * var(--btn) + var(--sr)); bottom: calc(var(--y) * var(--btn) + var(--sbm)); width: calc(var(--s) * var(--btn)); height: calc(var(--s) * var(--btn));
  border-radius: 50%; display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-size: calc(var(--fs, 16px) * var(--btn)); letter-spacing: .04em; line-height: 1;
  background: rgba(10, 16, 32, .42); border: 2px solid rgba(255,255,255,.35); color: rgba(255,255,255,.9); box-shadow: inset 0 0 20px rgba(255,255,255,.05); transition: transform .06s, background .06s; }
body.lefty .tbtn { right: auto; left: calc(var(--x) * var(--btn) + var(--sl)); }
.tbtn.on { transform: scale(.92); background: rgba(255,255,255,.35); }
.btn-jump { --x: 140px; --y: 28px; --s: 112px; --fs: 20px; border-color: rgba(120,200,255,.7); }
.btn-boost { --x: 22px; --y: 128px; --s: 108px; --fs: 19px; border-color: rgba(255,170,40,.85); color: #ffd27a; }
.btn-boost.on { background: rgba(255,150,30,.55); }
.btn-drift { --x: 268px; --y: 34px; --s: 80px; --fs: 14px; }
.btn-rolll { --x: 292px; --y: 136px; --s: 58px; --fs: 24px; }
.btn-rollr { --x: 226px; --y: 148px; --s: 58px; --fs: 24px; }
.btn-brake { --x: 22px; --y: 30px; --s: 76px; --fs: 13px; }
.btn-ballcam { --x: 22px; --y: 250px; --s: 62px; --fs: 11px; }
.btn-ballcam.active { border-color: var(--amber); color: var(--amber); }
.btn-item { --x: 100px; --y: 256px; --s: 70px; --fs: 13px; }
.btn-item.ready { border-color: var(--good); color: var(--good); animation: pulse 1s infinite; }
@media (pointer: fine) { #touch .tbtn, .stick-hint { opacity: .35; } }
@media (max-height: 560px) { :root { --btn: .8; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

#rotate { display: none; }
@media (orientation: portrait) and (max-width: 1100px) {
  body:not([data-screen]) #rotate, body[data-screen="game"] #rotate { display: block; position: fixed; left: 50%; top: calc(70px + var(--st)); transform: translateX(-50%); z-index: 40; background: var(--panel); border: 1px solid var(--panel-edge); padding: 8px 14px; border-radius: 6px; font-size: 14px; pointer-events: none; white-space: nowrap; }
}

/* controller */
.padfocus { outline: 3px solid var(--amber) !important; outline-offset: 3px; box-shadow: 0 0 24px rgba(255,194,58,.35); }
.mbtn.padfocus { transform: skewX(-10deg) translateX(6px); }
.pc-pad { font-size: 12px; color: var(--ink-dim); }
body.pad #touch .tbtn, body.pad .stick-hint { display: none; }
body.pad .boostmeter { bottom: calc(24px + var(--sbm)); }
body.pad .itemslot { bottom: calc(150px + var(--sbm)); right: calc(26px + var(--sr)); }

.fpbtns .hbtn.wide { justify-content: start; display: flex; gap: 8px; align-items: center; height: 40px; }
.padkey { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 4px; border-radius: 4px; background: rgba(255,255,255,.14); font-size: 12px; font-family: var(--f-display); font-weight: 400; }
body:not(.pad) .fpbtns .padkey { display: none; }

/* ranks */
.rankpanel { display: flex; gap: 16px; align-items: center; padding: 12px 16px; background: rgba(255,255,255,.04); border: 1px solid var(--panel-edge); border-radius: 8px; max-width: 760px; }
.rp-name { font-family: var(--f-display); font-size: 22px; font-style: italic; }
.rp-sub { font-size: 14px; color: var(--ink); line-height: 1.4; }
.rp-sub.dim { color: var(--ink-dim); }
.modes.locked .mode:disabled { opacity: .35; cursor: not-allowed; }
.rankcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; max-width: 760px; }
.rankcards .rankcard { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.rk-pl { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
.rankresult { display: flex; gap: 14px; align-items: center; padding: 10px 18px; border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid var(--rc, var(--panel-edge)); }
.rankresult b { font-family: var(--f-display); font-weight: 400; font-size: 22px; display: block; }
.rankresult small { color: var(--ink-dim); font-size: 14px; }
.rankresult.big { animation: dropIn .7s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 0 40px -8px var(--rc); }
.rankresult.big b { font-size: 30px; }
.rbadge { display: block; }

.postchat { display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(720px, 100%); }
.postchatlog { width: 100%; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.postchatlog .citem { align-self: center; }

/* ---------------- online party ---------------- */
.party { gap: 14px; }
.pcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 760px; }
.pbox { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.pbox h3 { margin: 0; }
.pbox p { margin: 0; color: var(--ink-dim); }
.pcode-in { font-family: var(--f-display); font-size: 30px; letter-spacing: .3em; text-transform: uppercase; width: 100%; max-width: 230px; padding: 8px 12px;
  background: rgba(0,0,0,.35); color: #fff; border: 1px solid var(--panel-edge); border-radius: 6px; }
.pcodebig { display: flex; flex-direction: column; align-items: flex-start; }
.pcodebig small { font-size: 12px; letter-spacing: .16em; color: var(--ink-dim); }
.pcodebig b { font-family: var(--f-display); font-size: clamp(40px, 7vw, 64px); letter-spacing: .25em; color: var(--amber); line-height: 1.05; user-select: all; -webkit-user-select: all; }
.pnote { color: var(--ink-dim); max-width: 640px; }
.perr { color: #ff8a8a; background: rgba(255, 60, 60, .12); border: 1px solid rgba(255, 90, 90, .4); padding: 8px 12px; border-radius: 6px; max-width: 640px; }
.pmembers { display: flex; flex-wrap: wrap; gap: 10px; }
.pmem { background: var(--panel); border: 1px solid var(--panel-edge); border-left: 4px solid var(--blue); border-radius: 6px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 150px; }
.pmem.t1 { border-left-color: var(--orange); }
.pmem small { color: var(--ink-dim); }
.party .seg button:disabled { opacity: .7; }
.party .field { align-items: flex-start; }
.party .field select { min-width: 260px; }

</style>

<script>/* src/core.js */
'use strict';
// ============================================================================
// BOOST LEAGUE — core constants, math helpers, persistence
// World units are "uu" (unreal units, ~1cm). Axes: x = width, y = up, z = length.
// Blue team defends the -z goal, Orange defends +z.
// ============================================================================

const PHYS = {
  TICK: 1 / 120,
  GRAVITY: 650,
  BALL_RADIUS: 92.75,
  BALL_MASS: 30,
  BALL_MAX_SPEED: 6000,
  BALL_MAX_SPIN: 6,
  BALL_DRAG: 0.0305,
  BALL_RESTITUTION: 0.6,
  BALL_FRICTION: 0.35,
  CAR_MASS: 180,
  CAR_MAX_SPEED: 2300,
  SUPERSONIC_START: 2200,
  SUPERSONIC_KEEP: 2100,
  BOOST_ACCEL: 991.667,
  BOOST_USE: 33.3,
  BOOST_START: 33.3,
  BRAKE_ACCEL: 3500,
  COAST_DECEL: 525,
  AIR_THROTTLE_ACCEL: 66.667,
  JUMP_IMPULSE: 291.667,
  JUMP_HOLD_ACCEL: 1458.333,
  JUMP_HOLD_TIME: 0.2,
  JUMP_MIN_TIME: 0.025,
  DOUBLE_JUMP_WINDOW: 1.25,
  DODGE_TIME: 0.65,
  FLIP_SPIN_TIME: 0.62,
  DODGE_IMPULSE: 500,
  STICKY_FORCE: 325,
  REST_HEIGHT: 17,
  MAX_ANG_VEL: 5.5,
  DEMO_RESPAWN: 3,
  PAD_BIG_TIME: 10,
  PAD_SMALL_TIME: 4,
};

// Steering curvature vs forward speed (1/turn radius)
const STEER_CURVE = [[0, 0.00690], [500, 0.00398], [1000, 0.00235], [1500, 0.001375], [1750, 0.0011], [2300, 0.00088]];
// Throttle acceleration vs forward speed
const THROTTLE_CURVE = [[0, 1600], [1400, 160], [1410, 0], [2300, 0]];
// Extra "psyonix" hit impulse scale vs relative speed
const HIT_SCALE_CURVE = [[0, 0.65], [500, 0.65], [2300, 0.55], [4600, 0.30]];

function curveLookup(curve, x) {
  if (x <= curve[0][0]) return curve[0][1];
  for (let i = 1; i < curve.length; i++) {
    if (x <= curve[i][0]) {
      const a = curve[i - 1], b = curve[i];
      return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
  }
  return curve[curve.length - 1][1];
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : 1);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
function angleWrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

const V3 = THREE.Vector3;
const Q4 = THREE.Quaternion;
const UP = new V3(0, 1, 0);
const _tv = [];
for (let i = 0; i < 32; i++) _tv.push(new V3());
let _tvi = 0;
// rotating pool of scratch vectors (never hold on to these across calls)
function tmpV(x = 0, y = 0, z = 0) { const v = _tv[_tvi]; _tvi = (_tvi + 1) & 31; return v.set(x, y, z); }

const TEAM_COLORS = [
  { main: 0x2f7bff, light: 0x8fbcff, dark: 0x0b2a66, css: '#3d86ff', name: 'BLUE' },
  { main: 0xff7a1a, light: 0xffc08a, dark: 0x6b2600, css: '#ff8a2b', name: 'ORANGE' },
];

// ---------------------------------------------------------------------------
// Persistence (localStorage can be unavailable — every access is guarded)
// ---------------------------------------------------------------------------
const Store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('boostleague.' + key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem('boostleague.' + key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  },
};

const DEFAULT_SETTINGS = {
  fov: 100, camDist: 270, camHeight: 105, camAngle: -4, camStiffness: 0.45, camShake: true, ballCamDefault: true,
  autoGas: true, stickSize: 1, buttonSize: 1, leftHanded: false, deadzone: 0.12, sensitivity: 1.15, haptics: true,
  quality: 'auto', particles: true, showFps: false, nameplates: true, ballIndicator: true,
  master: 0.8, sfx: 0.9, music: 0.5, crowd: 0.7,
};
const Settings = Object.assign({}, DEFAULT_SETTINGS, Store.get('settings', {}));

const DEFAULT_PROFILE = {
  name: 'Player', title: 'ROOKIE', xp: 0, level: 1, mmr: 600, wins: 0, losses: 0, goals: 0, saves: 0, assists: 0, mvps: 0, demos: 0,
  car: { body: 'striker', paint: 0, accent: 0xeeeeee, decal: 'stripes', wheels: 'classic', boost: 'standard', explosion: 'classic', topper: 'none', antenna: 'none' },
  unlocked: { body: ['striker', 'phantom', 'blade'], decal: ['none', 'stripes'], wheels: ['classic'], boost: ['standard'], explosion: ['classic'], topper: ['none'], antenna: ['none'] },
  newItems: [],
};
const Profile = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_PROFILE)), Store.get('profile', {}));
Profile.car = Object.assign({}, DEFAULT_PROFILE.car, Profile.car || {});
Profile.unlocked = Object.assign({}, DEFAULT_PROFILE.unlocked, Profile.unlocked || {});

function xpForLevel(l) { return 600 + l * 150; }

</script>
<script>/* src/cloud.js */
'use strict';
// ============================================================================
// Cloud save: progress (profile, ranks, garage, settings) is stored in the
// viewer's private space in the artifact database, so it survives closing the
// game, clearing Safari data or switching devices. Falls back to on-device
// storage when the database isn't available (e.g. the plain HTML file).
// ============================================================================

const Cloud = {
  status: 'local', // local | connecting | cloud | error
  doc: null, timer: null, writing: false, dirty: false, lastSaved: 0,

  async init() {
    const api = window.claude;
    if (!api || !api.use) { this.status = 'local'; return; }
    this.status = 'connecting';
    try {
      const [user, db] = await Promise.all([api.use('user'), api.use('db')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { this.status = 'local'; return; }
      this.doc = db.doc('data/users/' + id + '/save');
      const snap = await this.doc.get();
      if (snap.exists) this.merge(snap.data());
      this.status = 'cloud';
      // first save (or local progress made before the cloud answered)
      this.dirty = true; this.flush();
    } catch (e) {
      this.status = 'error';
    }
    if (typeof UI !== 'undefined' && UI.screen === 'main') UI.show('main');
  },

  // cloud copy wins when it is newer than what this device has
  merge(data) {
    if (!data || !data.profile) return;
    const localAt = Profile.savedAt || 0, cloudAt = data.savedAt || 0;
    if (cloudAt < localAt) return;
    const p = data.profile;
    for (const k of Object.keys(Profile)) delete Profile[k];
    Object.assign(Profile, JSON.parse(JSON.stringify(DEFAULT_PROFILE)), p);
    Profile.car = Object.assign({}, DEFAULT_PROFILE.car, p.car || {});
    Profile.unlocked = Object.assign({}, DEFAULT_PROFILE.unlocked, p.unlocked || {});
    if (data.settings) Object.assign(Settings, data.settings);
    try { localStorage.setItem('boostleague.profile', JSON.stringify(Profile)); localStorage.setItem('boostleague.settings', JSON.stringify(Settings)); } catch (e) { /* ignore */ }
    if (typeof applySettings === 'function') applySettings(true);
  },

  // called after every local save; coalesces bursts into one write
  schedule() {
    this.dirty = true;
    if (!this.doc) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1200);
  },
  async flush() {
    if (!this.doc || !this.dirty || this.writing) return;
    this.dirty = false; this.writing = true;
    try {
      await this.doc.set({ v: 1, savedAt: Profile.savedAt || Date.now(), profile: JSON.parse(JSON.stringify(Profile)), settings: JSON.parse(JSON.stringify(Settings)) });
      this.lastSaved = Date.now(); this.status = 'cloud';
    } catch (e) {
      if (e && e.code === 'unavailable') { this.dirty = true; setTimeout(() => this.flush(), 2500 + Math.random() * 2000); }

    }

    if (this.dirty) this.schedule();
  },

    if (this.status === 'connecting') return '☁ Connecting to cloud save…';
    if (this.status === 'error') return 'Saved on this device (cloud save unavailable)';

  },

// save hooks: stamp the time, keep a local copy, and sync to the cloud
function saveProfile() { Profile.savedAt = Date.now(); Store.set('profile', Profile); Cloud.schedule(); }
function saveSettings() { Profile.savedAt = Date.now(); Store.set('settings', Settings); Store.set('profile', Profile); Cloud.schedule(); }

<script>/* src/arena.js */
'use strict';
// ============================================================================
// Arena geometry: exact-ish signed distance field for collisions, layouts
// ============================================================================

const ARENA_DEFS = {
  soccar: {
    W: 4096, L: 5120, H: 2044, Rc: 1150, Rf: 300, Rt: 320,
    goal: { w: 893, h: 642.775, d: 880 },
    pads: 'soccar',
  },
  hoops: {
    W: 2966, L: 3581, H: 1820, Rc: 900, Rf: 280, Rt: 280,
    hoop: { z: 2990, r: 520, y: 395, tube: 28 },
    pads: 'hoops',
  },
  dropshot: {
    W: 4000, L: 4800, H: 2000, Rc: 1700, Rf: 300, Rt: 300,
    dropshot: { s: 443 },
    pads: 'none',
  },
};

let ARENA = ARENA_DEFS.soccar;
const Tiles = { list: [], map: new Map() };

function setArena(kind) {
  ARENA = ARENA_DEFS[kind];
  ARENA.kind = kind;
  if (ARENA.dropshot) buildDropshotTiles();
}

// ---------------------------------------------------------------------------
// Dropshot hex tiles (flat-topped hexes, axial coordinates)
// ---------------------------------------------------------------------------
const SQ3 = Math.sqrt(3);
function hexKey(q, r) { return q * 1000 + r; }
function hexRound(qf, rf) {
  let x = qf, z = rf, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
const HEX_ZOFF = 0; // grid offset so the centre line falls between rows
function pointToHex(x, z) {
  const s = ARENA.dropshot.s;
  const q = (2 / 3 * x) / s;
  const r = (-1 / 3 * x + SQ3 / 3 * (z - HEX_ZOFF)) / s;
  return hexRound(q, r);
}
function hexCenter(q, r) {
  const s = ARENA.dropshot.s;
  return [s * 1.5 * q, s * SQ3 * (r + q / 2) + HEX_ZOFF];
}
function buildDropshotTiles() {
  Tiles.list = []; Tiles.map.clear();
  const s = ARENA.dropshot.s;
  for (let q = -12; q <= 12; q++) for (let r = -16; r <= 16; r++) {
    const [x, z] = hexCenter(q, r);
    if (Math.abs(z) < s * 0.7) continue; // neutral centre strip
    if (wallDist2D(x, z) < s * 0.85) continue;
    const t = { q, r, x, z, team: z < 0 ? 0 : 1, state: 0, flash: 0 };
    Tiles.list.push(t); Tiles.map.set(hexKey(q, r), t);
  }
}
function tileAt(x, z) {
  const [q, r] = pointToHex(x, z);
  return Tiles.map.get(hexKey(q, r));
}

// 2D distance from (x,z) to the outline wall (positive inside)
function wallDist2D(x, z) {
  const A = ARENA, ax = Math.abs(x), az = Math.abs(z);
  if (ax > A.W - A.Rc && az > A.L - A.Rc) return A.Rc - Math.hypot(ax - (A.W - A.Rc), az - (A.L - A.Rc));
  return Math.min(A.W - ax, A.L - az);
}

// ---------------------------------------------------------------------------
// Signed distance from a point to the nearest solid (positive = free space)
// mode: 0 = car, 1 = ball
// ---------------------------------------------------------------------------
function filletD(w, h, R) {
  // w: distance to wall, h: distance to floor/ceiling. Returns distance to fillet solid or Infinity
  if (w < R && h < R) return R - Math.hypot(R - w, R - h);
  return Infinity;
}

function arenaDist(x, y, z, forBall) {
  const A = ARENA;
  const ax = Math.abs(x), az = Math.abs(z);
  const g = A.goal;

  // ---- inside a goal tunnel ----
  if (g && az > A.L) {
    if (ax < g.w && y < g.h) return Math.min(g.w - ax, g.h - y, A.L + g.d - az, y);
    // inside the back wall next to the goal: push out the shortest way (into the field or into the goal)
    const ex = Math.min(az - A.L, (ax >= g.w && y < g.h) ? ax - g.w : Infinity, (y >= g.h && ax < g.w) ? y - g.h : Infinity);
    return -ex;
  }

  let floorD = y;
  if (forBall && A.dropshot && y < 400) {
    const t = tileAt(x, z);
    if (t && t.state === 2) {
      // hole: distance to the hole rim (approx: hex inscribed circle)
      const rr = A.dropshot.s * 0.866;
      const ho = Math.hypot(x - t.x, z - t.z);
      const edge = rr - ho;
      floorD = y > 0 ? Math.hypot(Math.max(0, edge), y) : (edge > 0 ? 1e4 : -y);
      if (edge > BALL_R_CUR() * 0.98) floorD = 1e4;
    }
  }
  let d = Math.min(floorD, A.H - y);

  const W = A.W, L = A.L, Rc = A.Rc, Rf = A.Rf, Rt = A.Rt;
  const inCorner = ax > W - Rc && az > L - Rc;
  let wSide = Infinity, wBack = Infinity, wCorner = Infinity;
  if (inCorner) wCorner = Rc - Math.hypot(ax - (W - Rc), az - (L - Rc));
  else { wSide = W - ax; wBack = L - az; }
  d = Math.min(d, wSide, wCorner);

  const mouthX = g && !inCorner && ax < g.w;
  if (mouthX && y < g.h) d = Math.min(d, Math.hypot(wBack, Math.min(g.w - ax, g.h - y)));
  else d = Math.min(d, wBack);

  // floor fillets
  if (y < Rf) {
    d = Math.min(d, filletD(wSide, y, Rf), filletD(wCorner, y, Rf));
    if (!mouthX) d = Math.min(d, filletD(wBack, y, Rf));
    else if (wBack < Rf) {
      const t = Math.max(0, Rf - Math.hypot(Rf - wBack, Rf - y));
      d = Math.min(d, Math.hypot(g.w - ax, t));
    }
  }
  // ceiling fillets
  const yc = A.H - y;
  if (yc < Rt) d = Math.min(d, filletD(wSide, yc, Rt), filletD(wCorner, yc, Rt), filletD(wBack, yc, Rt));

  // hoops nets (hollow cylinders) + rims (tori)
  if (A.hoop) {
    const h = A.hoop;
    const dz = az - h.z;
    const rho = Math.hypot(x, dz);
    const tor = Math.hypot(rho - h.r, y - h.y) - h.tube;
    d = Math.min(d, tor);
    if (y < h.y) d = Math.min(d, Math.abs(rho - h.r) - h.tube);
  }
  return d;
}

// gradient of the field (surface normal pointing into free space)
function arenaNormal(x, y, z, forBall, out) {
  const e = 2;
  const nx = arenaDist(x + e, y, z, forBall) - arenaDist(x - e, y, z, forBall);
  const ny = arenaDist(x, y + e, z, forBall) - arenaDist(x, y - e, z, forBall);
  const nz = arenaDist(x, y, z + e, forBall) - arenaDist(x, y, z - e, forBall);
  out.set(nx, ny, nz);
  const l = out.length();
  if (l < 1e-6) out.set(0, 1, 0); else out.multiplyScalar(1 / l);
  return out;
}

let _ballRadiusCur = PHYS.BALL_RADIUS;
function BALL_R_CUR() { return _ballRadiusCur; }

// ---------------------------------------------------------------------------
// Boost pad layouts
// ---------------------------------------------------------------------------
function padLayout(kind) {
  if (kind === 'soccar') {
    const big = [[-3072, -4096], [3072, -4096], [-3584, 0], [3584, 0], [-3072, 4096], [3072, 4096]];
    const small = [[0, -4240], [-1792, -4184], [1792, -4184], [-940, -3308], [940, -3308], [0, -2816], [-3584, -2484], [3584, -2484],
      [-1788, -2300], [1788, -2300], [-2048, -1036], [0, -1024], [2048, -1036], [-1024, 0], [1024, 0], [-2048, 1036], [0, 1024],
      [2048, 1036], [-1788, 2300], [1788, 2300], [-3584, 2484], [3584, 2484], [0, 2816], [-940, 3310], [940, 3308], [-1792, 4184], [1792, 4184], [0, 4240]];
    return big.map(p => ({ x: p[0], z: p[1], big: true })).concat(small.map(p => ({ x: p[0], z: p[1], big: false })));
  }
  if (kind === 'hoops') {
    const big = [[-2176, 0], [2176, 0], [-1800, -2300], [1800, -2300], [-1800, 2300], [1800, 2300]];
    const small = [[0, -1300], [0, 1300], [-900, 0], [900, 0], [-1300, -1200], [1300, -1200], [-1300, 1200], [1300, 1200],
      [-2300, -1400], [2300, -1400], [-2300, 1400], [2300, 1400], [0, 0]];
    return big.map(p => ({ x: p[0], z: p[1], big: true })).concat(small.map(p => ({ x: p[0], z: p[1], big: false })));
  }
  return [];
}

// ---------------------------------------------------------------------------
// Kickoff spawns (blue side; orange is mirrored)
// ---------------------------------------------------------------------------
function kickoffSpots(kind) {
  if (kind === 'hoops') return [[-1600, -1900], [1600, -1900], [-500, -2150], [500, -2150], [0, -2300]];
  const s = kind === 'soccar' ? 1 : 0.85;
  return [
    [-2048 * s, -2560 * s], [2048 * s, -2560 * s], [-256 * s, -3840 * s], [256 * s, -3840 * s], [0, -4608 * s],
  ];
}
function respawnSpots(kind) {
  if (kind === 'hoops') return [[-1800, -3000], [1800, -3000], [-2200, -2750], [2200, -2750]];
  const s = kind === 'soccar' ? 1 : 0.85;
  return [[-2304 * s, -4608 * s], [-2688 * s, -4608 * s], [2304 * s, -4608 * s], [2688 * s, -4608 * s]];
}

<script>/* src/car.js */
'use strict';
// ============================================================================
// Car physics — ground driving, jumps, dodges, air control, wall driving
// Local frame: +X forward, +Y up, +Z right
// ============================================================================

const BODIES = {
  striker: { name: 'Striker', type: 'Octane', l: 118.01, w: 84.2, h: 36.16, ox: 13.88, oy: 20.75, wf: 51, wb: -34, rf: 12.5, rb: 15 },
  phantom: { name: 'Phantom', type: 'Dominus', l: 127.93, w: 83.28, h: 31.3, ox: 9.0, oy: 15.75, wf: 51, wb: -33, rf: 12, rb: 13.5 },
  blade: { name: 'Blade', type: 'Breakout', l: 131.49, w: 80.52, h: 30.3, ox: 12.5, oy: 11.75, wf: 51, wb: -35, rf: 13.5, rb: 15 },
  wedge: { name: 'Wedge', type: 'Plank', l: 128.82, w: 84.67, h: 29.39, ox: 9.01, oy: 12.09, wf: 50, wb: -35, rf: 12.5, rb: 14 },
  hybrid: { name: 'Hybrid X', type: 'Hybrid', l: 127.02, w: 82.19, h: 34.16, ox: 13.88, oy: 20.75, wf: 54, wb: -36, rf: 13, rb: 15 },
  tank: { name: 'Bulwark', type: 'Merc', l: 120.72, w: 76.71, h: 41.66, ox: 13.88, oy: 20.75, wf: 49, wb: -35, rf: 14, rb: 15.5 },
};

function newControls() {
  return { throttle: 0, steer: 0, pitch: 0, jump: false, boost: false, handbrake: false, rollL: false, rollR: false, useItem: false };
}

const _qa = new Q4(), _qb = new Q4(), _va = new V3(), _vb = new V3(), _vc = new V3(), _vd = new V3(), _ve = new V3(), _vn = new V3();

class Car {
  constructor(id, team, name, isBot, bodyKey, loadout) {
    this.id = id; this.team = team; this.name = name; this.isBot = isBot;
    this.loadout = loadout || {};
    this.setBody(bodyKey || 'striker');
    this.pos = new V3(); this.vel = new V3(); this.angVel = new V3(); this.quat = new Q4();
    this.ctrl = newControls(); this.prevJump = false; this.prevUse = false;
    this.stats = { score: 0, goals: 0, assists: 0, saves: 0, shots: 0, demos: 0, touches: 0, epicSaves: 0, aerials: 0 };
    this.item = null; this.itemTimer = 0;
    this.effects = {}; // rumble effects: spikes, magnet, powerhitter, disrupt etc.
    this.resetState();
  }
  setBody(key) {
    this.bodyKey = key; this.body = BODIES[key] || BODIES.striker;
    const b = this.body;
    this.half = new V3(b.l / 2, b.h / 2, b.w / 2);
    this.hbOff = new V3(b.ox, b.oy, 0); // hitbox centre relative to centre of mass (COM rests 17uu above ground)
    const hx = this.half.x, hy = this.half.y, hz = this.half.z, o = this.hbOff;
    this.samples = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) this.samples.push(new V3(o.x + sx * hx, o.y + sy * hy, sz * hz));
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) this.samples.push(new V3(o.x + sx * hx, o.y + sy * hy, 0));
    this.samples.push(new V3(o.x, o.y + hy, 0), new V3(o.x, o.y - hy, 0), new V3(o.x, o.y, hz), new V3(o.x, o.y, -hz));
    this.samples.push(new V3(o.x + hx * 0.3, o.y + hy, hz), new V3(o.x + hx * 0.3, o.y + hy, -hz), new V3(o.x - hx * 0.4, o.y + hy, hz), new V3(o.x - hx * 0.4, o.y + hy, -hz));

  }
  resetState() {
    this.vel.set(0, 0, 0); this.angVel.set(0, 0, 0);
    this.boost = PHYS.BOOST_START; this.onGround = false; this.groundN = new V3(0, 1, 0);
    this.jumped = false; this.jumpHeld = false; this.jumpTime = 0; this.timeSinceJump = 0;
    this.flipAvail = true; this.flipReset = false; this.dodging = false; this.dodgeT = 0; this.dodgeDir = [0, 0]; this.dodgeCancel = false;
    this.groundGrace = 0; this.supersonic = false; this.demolished = false; this.respawnT = 0;
    this.boosting = false; this.lastGroundTime = 0; this.airTime = 0; this.contactRoof = 0;
    this.restT = 0; this.recoverT = 0; this.recoverN = new V3(0, 1, 0); this.postFlipT = 0; this.dodgeAngle = 0; this.wedgeT = 0;
    this.wheelSpin = 0; this.steerVis = 0; this.landedT = 0; this.wasOnGround = false; this.slideAmt = 0;
    this.lastBallHit = -10; this.ballContact = false; this.wallTime = 0;
  }
  spawn(x, z, faceX, faceZ) {
    this.resetState();
    this.pos.set(x, PHYS.REST_HEIGHT, z);
    const a = Math.atan2(-(faceZ - z), faceX - x);

    this.onGround = true; this.groundN.set(0, 1, 0);

  }
  fwd(out) { return out.set(1, 0, 0).applyQuaternion(this.quat); }

  hitboxCenter(out) { return out.copy(this.hbOff).applyQuaternion(this.quat).add(this.pos); }

  // -------------------------------------------------------------------------
  step(dt, game) {

    // unlimited boost / regen modes

    let disrupt = this.effects.disrupt > 0 ? 1 : 0;
    let steer = c.steer, pitch = c.pitch, throttle = c.throttle;
    if (disrupt) { steer = clamp(steer + Math.sin(game.time * 9 + this.id) * 0.8, -1, 1); throttle = clamp(throttle + Math.sin(game.time * 5) * 0.6, -1, 1); }

    this.boosting = c.boost && canBoost;
    if (this.boosting && mut.boost !== 'unlimited') this.boost = Math.max(0, this.boost - PHYS.BOOST_USE * dt);

    this.timeSinceJump += dt;
    if (this.groundGrace > 0) this.groundGrace -= dt;

      this.airTime = 0;
      this.groundStep(dt, c, fwd, up, steer, throttle, grav);

    } else {
      this.airTime += dt;
      this.airStep(dt, c, fwd, up, steer, pitch, throttle, grav, jumpEdge, game);
    }

    // speed caps
    const sp = this.vel.length();
    if (sp > PHYS.CAR_MAX_SPEED) this.vel.multiplyScalar(PHYS.CAR_MAX_SPEED / sp);
    if (sp >= PHYS.SUPERSONIC_START) this.supersonic = true; else if (sp < PHYS.SUPERSONIC_KEEP) this.supersonic = false;

    this.pos.addScaledVector(this.vel, dt);

      _qa.setFromAxisAngle(_vc.copy(this.angVel).multiplyScalar(1 / w), w * dt);

    }

  }

  groundStep(dt, c, fwd, up, steer, throttle, grav) {
    const n = this.groundN;
    const f = _vc.copy(fwd).addScaledVector(n, -fwd.dot(n)).normalize();
    const r = _vd.crossVectors(f, n).normalize();
    let vf = this.vel.dot(f), vl = this.vel.dot(r), vn = this.vel.dot(n);

    let curv = curveLookup(STEER_CURVE, Math.abs(vf));
    if (c.handbrake) curv *= 1.4;
    const yawRate = -steer * curv * vf;
    _qa.setFromAxisAngle(n, yawRate * dt);
    f.applyQuaternion(_qa); r.applyQuaternion(_qa);
    this.angVel.copy(n).multiplyScalar(yawRate); // integrated in step()
    // the body turned but momentum didn't: re-split the velocity in the new heading
    vf = this.vel.dot(f); vl = this.vel.dot(r);

    if (this.boosting) throttle = 1;
    let acc = 0;
    if (Math.abs(throttle) > 0.02 && throttle * vf < 0 && Math.abs(vf) > 30) {
      acc = sign(throttle) * PHYS.BRAKE_ACCEL;
      if (Math.abs(acc * dt) > Math.abs(vf)) acc = -vf / dt;
    } else if (Math.abs(throttle) > 0.02) {
      acc = throttle * curveLookup(THROTTLE_CURVE, Math.abs(vf));
    } else {
      acc = -sign(vf) * Math.min(PHYS.COAST_DECEL, Math.abs(vf) / dt);
    }

    vf += acc * dt;

    // tyre grip: normally the tyres bend sideways momentum back into forward speed;
    // a powerslide lets the car slide sideways and keeps most of its speed
    const grip = c.handbrake ? 3 : 22;
    const vl2 = vl * Math.exp(-grip * dt);
    const keep = c.handbrake ? 0.75 : 1;
    vf = sign(vf || 1) * Math.sqrt(Math.max(0, vf * vf + (vl * vl - vl2 * vl2) * keep));
    vl = vl2;

    if (n.y < 0.7 && Math.abs(throttle) > 0.1 && Math.abs(vf) < 60) this.wedgeT += dt; else this.wedgeT = 0;
    if (this.wedgeT > 0.6) { this.wedgeT = 0; this.vel.addScaledVector(n, 250); this.onGround = false; this.groundGrace = 0.35; }
  }

  doJump(up, game) {

    this.onGround = false; this.groundGrace = 0.06; this.flipAvail = true; this.flipReset = false;
    this.jumpUp = up.clone();

  }

  airStep(dt, c, fwd, up, steer, pitch, throttle, grav, jumpEdge, game) {

    // and a car left lying on its side rights itself after a moment

    }

  if (game.time - last < 0.25) return;
  // who is the attacker? the one driving into the other with its nose
  const fa = A.fwd(new V3()), fb = B.fwd(new V3());
  const aAtt = A.vel.dot(n) - B.vel.dot(n) > 0 && fa.dot(n) > 0.5;
  const bAtt = B.vel.dot(n.clone().negate()) - A.vel.dot(n.clone().negate()) > 0 && fb.dot(n) < -0.5;
  let att = null, vic = null, dir = null;
  if (aAtt && (!bAtt || A.vel.length() >= B.vel.length())) { att = A; vic = B; dir = n.clone(); }
  else if (bAtt) { att = B; vic = A; dir = n.clone().negate(); }
  if (!att) return;
  game.bumpCooldown.set(key, game.time);
  const demoMode = game.mutators.demolish;
  const enemy = att.team !== vic.team;
  const canDemo = demoMode !== 'disabled' && (enemy || demoMode === 'friendly');
  if (canDemo && (att.supersonic || demoMode === 'contact' || att.effects.powerhitter > 0)) {
    game.demolish(att, vic);
    return;
  }
  const sp = att.vel.length();
  const vicGround = vic.onGround;
  const mul = vicGround ? 1 : 1.3;
  vic.vel.addScaledVector(dir, sp * 0.65 * mul).add(new V3(0, 1, 0).multiplyScalar(sp * (vicGround ? 0.28 : 0.15)));
  vic.onGround = false; vic.groundGrace = 0.1;
  game.events.push({ type: 'bump', car: att, victim: vic, strength: sp });
}

// ---------------------------------------------------------------------------
// Ball prediction (no cars) — used by bots, shot/save detection, UI
// ---------------------------------------------------------------------------
const Predict = {
  slices: [], ball: null,
  run(src, mut, seconds, hz, heat) {
    if (!this.ball) this.ball = new Ball();
    const b = this.ball;
    b.kind = src.kind; b.t = src.t; b.radius = src.radius; b.h = src.h; b.puck = src.puck; b.rest = src.rest; b.gravMul = src.gravMul;
    b.drag = src.drag; b.fric = src.fric; b.massMul = src.massMul; b.frozen = src.frozen;
    b.pos.copy(src.pos); b.vel.copy(src.vel); b.angVel.copy(src.angVel);
    const dt = 1 / hz, n = Math.floor(seconds * hz);
    while (this.slices.length < n) this.slices.push({ t: 0, pos: new V3(), vel: new V3() });
    this.count = n;
    const h = heat && heat.target >= 0 && typeof heatHome === 'function' ? { target: heat.target, speed: heat.speed } : null;
    for (let i = 0; i < n; i++) {
      if (h) heatHome(b, h, mut.gravity, dt);
      b.step(dt, mut, null);
      const s = this.slices[i];
      s.t = (i + 1) * dt; s.pos.copy(b.pos); s.vel.copy(b.vel);
    }
    return this.slices;
  },
};
// will a ball at this state enter a goal? returns team whose goal (0 blue / 1 orange) or -1
function predictGoal(ball, mut, seconds, heat) {
  const sl = Predict.run(ball, mut, seconds, 30, heat);
  for (let i = 0; i < Predict.count; i++) {
    const g = goalCheck(sl[i].pos, ball.radius);
    if (g >= 0) return { team: g, t: sl[i].t };
  }
  return null;
}
// returns team whose goal the ball is in (-1 = none)
function goalCheck(p, r) {
  const A = ARENA;
  if (A.goal) {
    if (Math.abs(p.z) > A.L + r * 0.98 && Math.abs(p.x) < A.goal.w && p.y < A.goal.h) return p.z < 0 ? 0 : 1;
  } else if (A.hoop) {
    const h = A.hoop;
    const dz = Math.abs(p.z) - h.z;
    if (Math.hypot(p.x, dz) < h.r - 10 && p.y < h.y - r * 0.6) return p.z < 0 ? 0 : 1;
  } else if (A.dropshot) {
    if (p.y < -r * 1.3) return p.z < 0 ? 0 : 1;
  }
  return -1;
}

<script>/* src/ranks.js */
'use strict';
// ============================================================================
// Ranked & casual matchmaking: placements, ranks with divisions, MMR, and
// bot difficulty that scales with your rating
// ============================================================================

const PLACEMENT_GAMES = 10;
const PLAYLISTS = { 1: 'Duel', 2: 'Doubles', 3: 'Standard', hoops: 'Hoops', rumble: 'Rumble', heatseeker: 'Heatseeker', dropshot: 'Dropshot', snowday: 'Snow Day' };
const RANKED_KEYS = ['1', '2', '3', 'hoops', 'rumble', 'heatseeker', 'dropshot', 'snowday'];
const START_MMR = 1860; // everyone starts at Supersonic Legend and finds their level from there
// Soccar has Duel/Doubles/Standard; every other mode has one rank of its own
function rankedKey(cfg) { return cfg.mode && cfg.mode !== 'soccar' ? cfg.mode : String(cfg.teamSize); }

// tiers: [name, min MMR, colour]
const TIERS = [
  ['Bronze', 0, '#c07a3e'], ['Silver', 300, '#b9c4cf'], ['Gold', 520, '#e9b931'], ['Platinum', 740, '#5fd6e3'],
  ['Diamond', 960, '#3d7dff'], ['Champion', 1180, '#a35cff'], ['Grand Champion', 1420, '#ff3b5c'], ['Supersonic Legend', 1700, '#ffffff'],
];
const ROMAN = ['I', 'II', 'III'];
const DIVS = ['I', 'II', 'III', 'IV'];

// a rank: tier index, sub-rank (I/II/III), division (I-IV)
function rankInfo(mmr) {
  mmr = Math.max(0, mmr);
  let t = 0;
  for (let i = 0; i < TIERS.length; i++) if (mmr >= TIERS[i][1]) t = i;
  const tier = TIERS[t];
  if (t === TIERS.length - 1) return { tier: t, name: tier[0], full: tier[0], color: tier[2], sub: 0, div: 0, divName: '', index: t * 3 };
  const span = TIERS[t + 1][1] - tier[1];
  const step = span / 3;
  const sub = Math.min(2, Math.floor((mmr - tier[1]) / step));
  const within = (mmr - tier[1] - sub * step) / step;
  const div = Math.min(3, Math.floor(within * 4));
  return { tier: t, name: tier[0] + ' ' + ROMAN[sub], full: tier[0] + ' ' + ROMAN[sub], color: tier[2], sub, div, divName: 'Div ' + DIVS[div], index: t * 3 + sub };
}
function rankFor(mmr) { return rankInfo(mmr).name; }

// ---------------------------------------------------------------------------
// Bot skill that scales with MMR (interpolated between anchor levels)
// ---------------------------------------------------------------------------
const SKILL_ANCHORS = [
  // better reactions, aim and decisions as the rank rises — same car, same boost, same physics as you
  [0, { react: 0.4, skill: 0.3, aerial: 0, maxBoost: 0.35, flip: 0.25, aim: 0.45, assist: 0.04, aggro: 0 }],
  [300, { react: 0.28, skill: 0.45, aerial: 0.15, maxBoost: 0.5, flip: 0.45, aim: 0.6, assist: 0.1, aggro: 0 }],
  [740, { react: 0.14, skill: 0.75, aerial: 0.55, maxBoost: 0.9, flip: 0.85, aim: 0.88, assist: 0.25, aggro: 0 }],
  [1180, { react: 0.055, skill: 0.97, aerial: 0.95, maxBoost: 1, flip: 1, aim: 0.99, assist: 0.27, aggro: 0 }],
  [1420, { react: 0.035, skill: 1, aerial: 1, maxBoost: 1, flip: 1, aim: 1, assist: 0.3, aggro: 1 }],
  [1700, { react: 0.022, skill: 1, aerial: 1.05, maxBoost: 1, flip: 1, aim: 1, assist: 0.35, aggro: 1 }],
  [2000, { react: 0.015, skill: 1, aerial: 1.1, maxBoost: 1, flip: 1, aim: 1, assist: 0.4, aggro: 1 }],
];
function levelForMMR(mmr) {
  const A = SKILL_ANCHORS;
  let i = 0;
  while (i < A.length - 2 && mmr > A[i + 1][0]) i++;
  const [m0, a] = A[i], [m1, b] = A[i + 1];
  const t = clamp((mmr - m0) / (m1 - m0), 0, 1);
  const lv = { name: 'Rated ' + Math.round(mmr), mmr };
  for (const k in a) lv[k] = a[k] + (b[k] - a[k]) * t;
  return lv;
}

// ---------------------------------------------------------------------------
// Player rating state (stored in Profile)
// ---------------------------------------------------------------------------
function ensureRatings() {
  const P = Profile;
  if (!P.ranked || P.rankVer !== 2) { P.ranked = {}; P.rankVer = 2; } // new ladder: everyone restarts at the top
  if (!P.casual) P.casual = {};
  for (const k of RANKED_KEYS) if (!P.ranked[k]) P.ranked[k] = { mmr: START_MMR, games: 0, wins: 0, losses: 0, placed: true, peak: START_MMR, streak: 0 };
  for (const k of ['1', '2', '3']) if (!P.casual[k]) P.casual[k] = { mmr: 250, games: 0, wins: 0, losses: 0, streak: 0 };
}
function rankedState(key) { ensureRatings(); return Profile.ranked[String(key)]; }
function casualState(size) { ensureRatings(); return Profile.casual[String(size)]; }
function rankLabel(key) {
  const r = rankedState(key), ri = rankInfo(r.mmr);
  return { text: `${ri.name}${ri.divName ? ' · ' + ri.divName : ''}`, color: ri.color, placed: true, info: ri };
}
function bestRank() {
  ensureRatings();
  let best = null;
  for (const k of RANKED_KEYS) { const r = Profile.ranked[k]; if (r.games > 0 && (!best || r.mmr > best.mmr)) best = r; }
  return best ? rankInfo(best.mmr) : null;
}

// The rating the bots are tuned to for a match
function matchRating(cfg) {
  if (cfg.competitive) return rankedState(rankedKey(cfg)).mmr;
  if (cfg.level === 'adaptive') return casualState(cfg.teamSize).mmr;
  return null;
}

// Apply a finished match; returns a summary for the post-match screen
function applyRatingResult(cfg, won, goalDiff) {
  const size = cfg.teamSize;
  if (cfg.competitive) {
    const key = rankedKey(cfg);
    const r = rankedState(key);
    const before = rankInfo(r.mmr);
    r.games++; if (won) r.wins++; else r.losses++;
    r.streak = won ? Math.max(1, r.streak + 1) : Math.min(-1, r.streak - 1);
    // wins climb steadily; losing streaks drop faster until you find the rank you can hold
    let delta;
    // every loss costs a real chunk, more on a losing streak: 2–3 losses in a row drop a rank
    if (won) delta = 14 + Math.min(8, (r.streak - 1) * 2) + clamp(goalDiff, 0, 3);
    else delta = -Math.min(80, 25 + 10 * (-r.streak - 1)) + clamp(goalDiff, -3, 0);
    r.mmr = clamp(r.mmr + delta, 0, 2200);
    r.peak = Math.max(r.peak || 0, r.mmr);
    const after = rankInfo(r.mmr);
    return {
      ranked: true, playlist: PLAYLISTS[key], delta, placed: true, games: r.games,
      before, after, rankUp: after.index > before.index, rankDown: after.index < before.index,
      divUp: after.index === before.index && after.div > before.div, divDown: after.index === before.index && after.div < before.div,
    };
  }
  if (cfg.level === 'adaptive') {
    const c = casualState(size);
    c.games++; if (won) c.wins++; else c.losses++;
    c.streak = won ? Math.max(1, c.streak + 1) : Math.min(-1, c.streak - 1);
    const delta = (won ? 18 : -14) + clamp(goalDiff, -3, 3) * 2;
    c.mmr = clamp(c.mmr + delta, 0, 2000);
    return { ranked: false, delta, casualMmr: c.mmr };
  }
  return null;
}

// small rank emblem (inline SVG) used in menus and the post-match screen
function rankBadge(info, size) {
  size = size || 48;
  const c = info ? info.color : '#5c6678';
  const pips = info && info.tier < TIERS.length - 1 ? info.sub + 1 : 0;
  const glow = info && info.tier >= 6;
  let p = '';
  for (let i = 0; i < pips; i++) p += `<rect x="${36 + (i - (pips - 1) / 2) * 12 - 3}" y="56" width="6" height="10" rx="1" fill="${c}"/>`;
  return `<svg class="rbadge" width="${size}" height="${size}" viewBox="0 0 72 72" aria-hidden="true">
    ${glow ? `<circle cx="36" cy="34" r="30" fill="${c}" opacity=".18"/>` : ''}

    let msg = null;
    if (ev.type === 'goal') {
      if (ev.team === this.car.team) msg = ev.scorer === this.car ? pick(['Calculated.', 'Siiiick!', 'What a play!', 'Whew.']) : pick(['Nice shot!', 'Great pass!', 'What a play!', 'Wow!']);
      else msg = pick(['Noooo!', 'Close one!', '$#@%!', 'My bad...', 'Whoops...', 'OMG!']);
    } else if (ev.type === 'save' && ev.car.team === this.car.team && ev.car !== this.car) msg = pick(['What a save!', 'Nice block!', 'Thanks!']);
    else if (ev.type === 'save' && ev.car.team !== this.car.team) msg = pick(['Close one!', 'No way!', 'Wow!']);
    else if (ev.type === 'demo' && ev.victim === this.car) msg = pick(['$#@%!', 'Noooo!', 'Okay.']);
    else if (ev.type === 'end') msg = pick(QUICKCHAT.PostGame);
    if (msg) { game.chat(this.car, msg, Math.random() < 0.6 && ev.type !== 'end'); this.chatCd = rand(6, 14); }
  }
}

function estimateHumanEta(car, p) {
  const d = Math.hypot(p.x - car.pos.x, p.z - car.pos.z);
  const f = car.fwd(_ai1); f.y = 0; f.normalize();
  const to = _ai2.copy(p).sub(car.pos); to.y = 0; to.normalize();
  const ang = Math.acos(clamp(f.dot(to), -1, 1));
  return d / Math.max(900, car.vel.length()) + ang * 0.45;
}

// is a human player driving at the ball?
function humanCommitted(car, ball) {
  const sp = car.vel.length();
  if (sp < 400) return car.pos.distanceTo(ball.pos) < 350;
  const to = _ai2.copy(ball.pos).sub(car.pos).normalize();
  return car.vel.dot(to) / sp > 0.7;
}
