<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FIFA 27 - FC Mobile Style</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
body { background: #0a0e27; color: #fff; font-family: Arial, sans-serif; width: 100vw; height: 100vh; overflow: hidden; }

#topbar { position: fixed; top: 0; left: 0; right: 0; background: #000; border-bottom: 3px solid #00d4ff; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 100; height: 50px; }
#topbar h2 { color: #00d4ff; margin: 0; font-size: 16px; }

.menu-container { width: 100%; height: 100vh; padding: 60px 20px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.title { font-size: 48px; color: #00d4ff; text-align: center; margin: 40px 0; }
.menu-btn { display: block; width: 90%; max-width: 300px; margin: 15px auto; padding: 20px; background: linear-gradient(135deg, #1a4d5c, #0d3a47); border: 3px solid #00d4ff; color: #fff; font-size: 18px; border-radius: 12px; cursor: pointer; text-align: center; -webkit-user-select: none; user-select: none; }
.menu-btn:active { background: #00d4ff; color: #000; }

#matchContainer { width: 100%; height: calc(100vh - 50px); position: relative; background: linear-gradient(180deg, #1a5c2a, #0d3a1a); }

#pitch { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #1a7d2a, #0d4a1a); overflow: hidden; }

.field-line { position: absolute; background: #fff; opacity: 0.3; }
.center-line { width: 2px; height: 100%; left: 50%; top: 0; }
.halfway-line { width: 100%; height: 2px; top: 50%; left: 0; }
.center-circle { width: 20%; height: 20%; border: 2px solid #fff; border-radius: 50%; left: 40%; top: 40%; opacity: 0.3; }

#scoreboard { position: absolute; top: 60px; left: 0; right: 0; background: rgba(0, 0, 0, 0.6); border-bottom: 2px solid #00d4ff; padding: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 50; font-size: 14px; }
.score-side { flex: 1; text-align: center; }
.team-name { font-weight: bold; color: #00d4ff; }
.score { font-size: 24px; font-weight: bold; color: #fff; }
.timer { flex: 1; text-align: center; font-size: 18px; color: #00d4ff; font-weight: bold; }
.player-info { position: absolute; top: 110px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 2px solid #00d4ff; padding: 8px; border-radius: 6px; font-size: 12px; width: 120px; }
.player-portrait { width: 40px; height: 40px; background: #00d4ff; border-radius: 4px; margin-top: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

.player { position: absolute; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #000; transition: all 0.05s linear; }
.player.home { background: #fff; }
.player.away { background: #4a90e2; }
.player.controlled { filter: drop-shadow(0 0 15px #ffd700); transform: scale(1.3); }

.ball { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; filter: drop-shadow(0 0 8px #ff9900); }

#joystick-area { position: absolute; bottom: 20px; left: 20px; width: 90px; height: 90px; background: rgba(0, 212, 255, 0.2); border: 3px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 40; }
#joystick-inner { width: 40px; height: 40px; background: #00d4ff; border-radius: 50%; position: absolute; }

#controls { position: absolute; bottom: 20px; right: 20px; width: 160px; z-index: 40; }
.control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; -webkit-user-select: none; user-select: none; transition: all 0.1s; }
.btn-action { background: #00d4ff; color: #000; }
.btn-action:active { background: #0099aa; transform: scale(0.95); }
.btn-sprint { background: #ff3333; color: #fff; grid-column: 1 / 3; }
.btn-sprint:active { background: #cc0000; transform: scale(0.95); }
.btn-special { background: #ffd700; color: #000; }
.btn-special:active { background: #ccaa00; transform: scale(0.95); }

.event-log { position: absolute; top: 120px; left: 10px; width: 150px; background: rgba(0, 0, 0, 0.7); border: 2px solid #00d4ff; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; font-size: 11px; z-index: 30; }
.event-item { padding: 3px 0; border-bottom: 1px solid #333; }

#matchOverlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
#matchOverlay.show { display: flex; }
#resultBox { text-align: center; background: rgba(0, 212, 255, 0.2); border: 3px solid #00d4ff; padding: 30px; border-radius: 12px; }
#resultBox h2 { font-size: 36px; margin: 20px 0; color: #00d4ff; }
#resultBox p { font-size: 24px; margin: 10px 0; }
#continueBtn { margin-top: 30px; padding: 15px 30px; background: #00d4ff; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div id="topbar">
    <h2 id="pageTitle">⚽ FIFA 27 - FC Mobile</h2>
</div>

<div id="menuScreen" class="menu-container">
    <div class="title">⚽ FIFA 27</div>
    <div class="menu-btn" id="btn-play">▶️ PLAY MATCH</div>
    <div class="menu-btn" id="btn-settings">⚙️ SETTINGS</div>
</div>

<div id="matchContainer" style="display:none">
    <div id="pitch">
        <div class="field-line center-line"></div>
        <div class="field-line halfway-line"></div>
        <div class="field-line center-circle"></div>

        <div id="scoreboard">
            <div class="score-side">
                <div class="team-name" id="homeTeam">ENG</div>
                <div class="score" id="homeScore">0</div>
            </div>
            <div class="timer" id="timer">00:00</div>
            <div class="score-side">
                <div class="team-name" id="awayTeam">ARG</div>
                <div class="score" id="awayScore">0</div>
            </div>
        </div>

        <div class="player-info">
            <div style="font-size: 11px; color: #00d4ff;">Controlled:</div>
            <div id="controlledPlayerName" style="color: #fff; font-weight: bold; font-size: 12px;">Player 1</div>
            <div class="player-portrait" id="controlledPlayerPortrait">1</div>
        </div>

        <div id="players"></div>
        <div id="ball" class="ball"></div>

        <div class="event-log" id="eventLog"></div>

        <div id="joystick-area">
            <div id="joystick-inner"></div>
        </div>

        <div id="controls">
            <div class="control-row">
                <button class="btn btn-action" id="btn-pass">→ PASS</button>
                <button class="btn btn-action" id="btn-shoot">⚽ SHOOT</button>
            </div>
            <div class="control-row">
                <button class="btn btn-action" id="btn-defend">🛡️ DEF</button>
                <button class="btn btn-special" id="btn-switch">SWITCH</button>
            </div>
            <div class="control-row">
                <button class="btn btn-special" id="btn-2nd">2ND DEF</button>
            </div>
            <div class="control-row">
                <button class="btn btn-sprint" id="btn-sprint">🏃 SPRINT</button>
            </div>
        </div>
    </div>

    <div id="matchOverlay">
        <div id="resultBox">
            <h2 id="resultTitle">MATCH OVER!</h2>
            <p><span id="finalHome">0</span> - <span id="finalAway">0</span></p>
            <p id="resultText">Draw</p>
            <p id="coinsText">Coins: +1000</p>
            <button id="continueBtn">CONTINUE</button>
        </div>
    </div>
</div>

<script>
const g = {
    state: {
        time: 0,
        homeScore: 0,
        awayScore: 0,
        matchDuration: 90,
        events: [],
        sprinting: false,
        controllerId: 0,
        gameRunning: true
    },

    settings: {
        difficulty: 'Normal',
        matchDuration: 90,
        shotChance: {Easy: 0.45, Normal: 0.25, Hard: 0.15, Legendary: 0.08}
    },

    players: {
        home: [
            {id: 0, x: 15, y: 20, name: 'Keeper', number: 1, rating: 87},
            {id: 1, x: 25, y: 15, name: 'Defender 1', number: 2, rating: 85},
            {id: 2, x: 25, y: 30, name: 'Defender 2', number: 3, rating: 85},
            {id: 3, x: 25, y: 45, name: 'Defender 3', number: 4, rating: 84},
            {id: 4, x: 25, y: 60, name: 'Defender 4', number: 5, rating: 85},
            {id: 5, x: 40, y: 25, name: 'Midfielder 1', number: 6, rating: 86},
            {id: 6, x: 40, y: 45, name: 'Midfielder 2', number: 7, rating: 86},
            {id: 7, x: 40, y: 65, name: 'Midfielder 3', number: 8, rating: 85},
            {id: 8, x: 60, y: 20, name: 'Forward 1', number: 9, rating: 88},
            {id: 9, x: 60, y: 45, name: 'Forward 2', number: 10, rating: 89},
            {id: 10, x: 60, y: 70, name: 'Winger', number: 11, rating: 87}
        ],
        away: [
            {id: 11, x: 85, y: 20, name: 'Keeper', number: 1, rating: 87},
            {id: 12, x: 75, y: 15, name: 'Defender 1', number: 2, rating: 86},
            {id: 13, x: 75, y: 30, name: 'Defender 2', number: 3, rating: 86},
            {id: 14, x: 75, y: 45, name: 'Defender 3', number: 4, rating: 85},
            {id: 15, x: 75, y: 60, name: 'Defender 4', number: 5, rating: 86},
            {id: 16, x: 60, y: 25, name: 'Midfielder 1', number: 6, rating: 87},
            {id: 17, x: 60, y: 45, name: 'Midfielder 2', number: 7, rating: 87},
            {id: 18, x: 60, y: 65, name: 'Midfielder 3', number: 8, rating: 86},
            {id: 19, x: 40, y: 20, name: 'Forward 1', number: 9, rating: 89},
            {id: 20, x: 40, y: 45, name: 'Forward 2', number: 10, rating: 88},
            {id: 21, x: 40, y: 70, name: 'Winger', number: 11, rating: 87}
        ]
    },

    ball: {x: 50, y: 50},

    init: function() {
        document.getElementById('btn-play').onclick = () => this.startMatch();
        document.getElementById('btn-settings').onclick = () => this.showSettings();
        document.getElementById('continueBtn').onclick = () => this.backToMenu();

        document.getElementById('btn-shoot').onmousedown = (e) => {e.preventDefault(); this.shoot();};
        document.getElementById('btn-shoot').ontouchstart = (e) => {e.preventDefault(); this.shoot();};
        document.getElementById('btn-pass').onmousedown = (e) => {e.preventDefault(); this.pass();};
        document.getElementById('btn-pass').ontouchstart = (e) => {e.preventDefault(); this.pass();};
        document.getElementById('btn-defend').onmousedown = (e) => {e.preventDefault(); this.defend();};
        document.getElementById('btn-defend').ontouchstart = (e) => {e.preventDefault(); this.defend();};
        document.getElementById('btn-switch').onmousedown = (e) => {e.preventDefault(); this.switchPlayer();};
        document.getElementById('btn-switch').ontouchstart = (e) => {e.preventDefault(); this.switchPlayer();};
        document.getElementById('btn-2nd').onmousedown = (e) => {e.preventDefault(); this.defend();};
        document.getElementById('btn-2nd').ontouchstart = (e) => {e.preventDefault(); this.defend();};

        document.getElementById('btn-sprint').onmousedown = (e) => {e.preventDefault(); this.state.sprinting = true;};
        document.getElementById('btn-sprint').onmouseup = () => {this.state.sprinting = false;};
        document.getElementById('btn-sprint').ontouchstart = (e) => {e.preventDefault(); this.state.sprinting = true;};
        document.getElementById('btn-sprint').ontouchend = () => {this.state.sprinting = false;};
        document.getElementById('btn-sprint').onmouseleave = () => {this.state.sprinting = false;};
        document.getElementById('btn-sprint').ontouchcancel = () => {this.state.sprinting = false;};

        this.setupJoystick();
    },

    setupJoystick: function() {
        const joystickArea = document.getElementById('joystick-area');
        const joystickInner = document.getElementById('joystick-inner');
        const maxRadius = 25;

        const handleJoystickMove = (e) => {
            if (!this.state.gameRunning) return;
            e.preventDefault();

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickInner.style.left = (45 + dx) + 'px';
            joystickInner.style.top = (45 + dy) + 'px';

            const controlled = this.getControlledPlayer();
            if (controlled) {
                let speed = 0.5;
                if (this.state.sprinting) speed = 1.2;

                controlled.x += (dx / maxRadius) * speed * 0.3;
                controlled.y += (dy / maxRadius) * speed * 0.3;

                controlled.x = Math.max(5, Math.min(95, controlled.x));
                controlled.y = Math.max(10, Math.min(90, controlled.y));

                this.ball.x = controlled.x;
                this.ball.y = controlled.y;
            }

            this.render();
        };

        const handleJoystickEnd = () => {
            joystickInner.style.left = '25px';
            joystickInner.style.top = '25px';
        };

        document.addEventListener('mousemove', (e) => {
            if (e.buttons & 1) handleJoystickMove(e);
        });
        document.addEventListener('mouseup', handleJoystickEnd);

        document.addEventListener('touchmove', handleJoystickMove);
        document.addEventListener('touchend', handleJoystickEnd);
    },

    getControlledPlayer: function() {
        const allPlayers = [...this.players.home, ...this.players.away];
        return allPlayers.find(p => p.id === this.state.controllerId);
    },

    switchPlayer: function() {
        const homeTeam = this.players.home;
        const nextId = this.state.controllerId === homeTeam[homeTeam.length - 1].id ? homeTeam[0].id : homeTeam[(homeTeam.findIndex(p => p.id === this.state.controllerId) + 1) % homeTeam.length].id;
        this.state.controllerId = nextId;
        this.addEvent('👤 Switched Player');
    },

    shoot: function() {
        if (!this.state.gameRunning) return;
        const chance = this.settings.shotChance[this.settings.difficulty] || 0.25;
        if (Math.random() < chance) {
            this.state.homeScore++;
            this.addEvent('⚽ GOOOAAL!!!');
        } else {
            this.addEvent('❌ Missed');
        }
        this.state.time += 2;
        this.checkMatchEnd();
        this.render();
    },

    pass: function() {
        if (!this.state.gameRunning) return;
        const controlled = this.getControlledPlayer();
        if (controlled) {
            const nearbyPlayers = this.players.home.filter(p => p.id !== controlled.id && Math.sqrt(Math.pow(p.x - controlled.x, 2) + Math.pow(p.y - controlled.y, 2)) < 25);
            if (nearbyPlayers.length > 0) {
                const target = nearbyPlayers[Math.floor(Math.random() * nearbyPlayers.length)];
                this.ball.x = target.x;
                this.ball.y = target.y;
                this.addEvent('✓ Perfect Pass');
            } else {
                this.addEvent('❌ Pass out of play');
            }
        }
        this.state.time += 2;
        this.checkMatchEnd();
        this.render();
    },

    defend: function() {
        if (!this.state.gameRunning) return;
        if (Math.random() > 0.7) {
            this.state.awayScore++;
            this.addEvent('⚽ Opponent scores!');
        } else {
            this.addEvent('🛡️ Blocked');
        }
        this.state.time += 2;
        this.checkMatchEnd();
        this.render();
    },

    addEvent: function(text) {
        const log = document.getElementById('eventLog');
        const item = document.createElement('div');
        item.className = 'event-item';
        item.textContent = text;
        log.appendChild(item);
        log.scrollTop = log.scrollHeight;
        if (log.children.length > 10) log.removeChild(log.children[0]);
    },

    checkMatchEnd: function() {
        if (this.state.time >= this.settings.matchDuration * 60) {
            this.state.gameRunning = false;
            this.showResult();
        }
    },

    showResult: function() {
        const home = this.state.homeScore;
        const away = this.state.awayScore;
        const result = home > away ? 'WIN' : home === away ? 'DRAW' : 'LOSS';
        const coins = home > away ? 1500 : home === away ? 1000 : 500;

        document.getElementById('resultTitle').textContent = result;
        document.getElementById('finalHome').textContent = home;
        document.getElementById('finalAway').textContent = away;
        document.getElementById('resultText').textContent = home > away ? '🏆 Victory!' : home === away ? '⚔️ Draw' : '❌ Defeat';
        document.getElementById('coinsText').textContent = 'Coins: +' + coins;
        document.getElementById('matchOverlay').classList.add('show');
    },

    render: function() {
        document.getElementById('homeScore').textContent = this.state.homeScore;
        document.getElementById('awayScore').textContent = this.state.awayScore;

        const mins = Math.floor(this.state.time / 60);
        const secs = this.state.time % 60;
        document.getElementById('timer').textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

        const controlled = this.getControlledPlayer();
        if (controlled) {
            document.getElementById('controlledPlayerName').textContent = controlled.name;
            document.getElementById('controlledPlayerPortrait').textContent = controlled.number;
        }

        const playersContainer = document.getElementById('players');
        playersContainer.innerHTML = '';

        [...this.players.home, ...this.players.away].forEach(p => {
            const div = document.createElement('div');
            div.className = 'player ' + (p.id < 11 ? 'home' : 'away');
            if (p.id === this.state.controllerId) div.classList.add('controlled');
            div.style.left = p.x + '%';
            div.style.top = p.y + '%';
            div.textContent = p.number;
            playersContainer.appendChild(div);
        });

        const ballDiv = document.getElementById('ball');
        ballDiv.style.left = this.ball.x + '%';
        ballDiv.style.top = this.ball.y + '%';
    },

    startMatch: function() {
        this.state = {time: 0, homeScore: 0, awayScore: 0, matchDuration: this.settings.matchDuration, events: [], sprinting: false, controllerId: 0, gameRunning: true};
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('matchContainer').style.display = 'block';
        document.getElementById('matchOverlay').classList.remove('show');
        document.getElementById('eventLog').innerHTML = '';
        this.render();
        this.matchLoop();
    },

    matchLoop: function() {
        if (this.state.gameRunning) {
            this.state.time += 0.016;
            this.render();
            setTimeout(() => this.matchLoop(), 16);
        }
    },

    showSettings: function() {
        alert('Difficulty: ' + this.settings.difficulty + '\nMatch Duration: ' + this.settings.matchDuration + ' min');
    },

    backToMenu: function() {
        document.getElementById('menuScreen').style.display = 'flex';
        document.getElementById('matchContainer').style.display = 'none';
        this.state.gameRunning = false;
    }
};

g.init();
</script>

</body>
</html>
