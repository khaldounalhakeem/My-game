<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 1600px;
            height: 900px;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
            border: 3px solid #00a8ff;
            box-shadow: 0 0 30px rgba(0, 168, 255, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .score {
            font-size: 48px;
            min-width: 80px;
            text-align: center;
        }

        .timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }

        #menu.hidden {
            display: none;
        }

        #menu h1 {
            font-size: 72px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
        }

        #menu button {
            padding: 15px 40px;
            margin: 10px;
            font-size: 20px;
            background: linear-gradient(135deg, #00a8ff, #0088cc);
            color: white;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #menu button:hover {
            background: linear-gradient(135deg, #00ccff, #00a8ff);
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
            transform: scale(1.05);
        }

        #pauseMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 3px solid #00a8ff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            color: white;
            display: none;
        }

        #pauseMenu.visible {
            display: flex;
        }

        #pauseMenu h2 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
        }

        #pauseMenu button {
            padding: 12px 30px;
            margin: 8px;
            font-size: 18px;
            background: linear-gradient(135deg, #00a8ff, #0088cc);
            color: white;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #pauseMenu button:hover {
            background: linear-gradient(135deg, #00ccff, #00a8ff);
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            max-width: 300px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 3px solid #00a8ff;
            border-radius: 10px;
            text-align: center;
            z-index: 50;
            color: white;
            display: none;
        }

        #gameOver.visible {
            display: block;
        }

        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
        }

        #gameOver p {
            font-size: 32px;
            margin: 15px 0;
        }

        #gameOver button {
            padding: 12px 30px;
            margin-top: 20px;
            font-size: 18px;
            background: linear-gradient(135deg, #00a8ff, #0088cc);
            color: white;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #gameOver button:hover {
            background: linear-gradient(135deg, #00ccff, #00a8ff);
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.8);
        }

        .stat-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00a8ff;
            border-radius: 5px;
            color: #00a8ff;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="menu">
            <h1>🚀 ROCKET LEAGUE 🚀</h1>
            <button onclick="game.startGame()">Start Game</button>
            <button onclick="game.startTraining()">Training</button>
            <p style="margin-top: 40px; color: #aaa; font-size: 16px;">
                Arrow Keys or WASD - Move | Space - Jump | Shift - Boost | P - Pause
            </p>
        </div>

        <div id="ui">
            <div class="team">
                <span>BLUE</span>
                <div class="score" id="blueScore">0</div>
            </div>
            <div class="timer" id="timer">5:00</div>
            <div class="team">
                <div class="score" id="orangeScore">0</div>
                <span>ORANGE</span>
            </div>
        </div>

        <div id="pauseMenu">
            <h2>PAUSED</h2>
            <button onclick="game.resume()">Resume</button>
            <button onclick="game.goToMenu()">Main Menu</button>
        </div>

        <div id="gameOver">
            <h2 id="winnerText">GAME OVER</h2>
            <p id="scoreText"></p>
            <button onclick="game.goToMenu()">Main Menu</button>
        </div>

        <div class="stat-display" id="stats"></div>
        <div id="instructions"></div>
    </div>

    <script src="physics.js"></script>
    <script src="game.js"></script>
    <script src="ai.js"></script>
</body>
</html>
