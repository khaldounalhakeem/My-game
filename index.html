<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Arena</title>
  <meta name="description" content="Play chess against 30+ bots, get a full game review with move classifications and accuracy, learn from coaches, solve puzzles and analyse with Stockfish 19.">
  <meta name="theme-color" content="#302e2b">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-board="green">
  <div class="app">
    <aside class="sidebar">
      <div class="logo" data-go="home"><img src="assets/logo.svg" alt=""><span>Chess<em>Arena</em></span></div>
      <nav class="nav">
        <a data-go="home"><span class="ico">🏠</span>Home</a>
        <a data-go="bots"><span class="ico">🤖</span>Play Bots</a>
        <a data-go="friend"><span class="ico">👥</span>Play Friend</a>
        <a data-go="puzzles"><span class="ico">🧩</span>Puzzles</a>
        <a data-go="learn"><span class="ico">🎓</span>Learn</a>
        <a data-go="coaches"><span class="ico">🧑‍🏫</span>Coaches</a>
        <a data-go="analysis"><span class="ico">🔍</span>Analysis</a>
        <a data-go="archive"><span class="ico">📜</span>My Games</a>
        <a data-go="settings"><span class="ico">⚙️</span>Settings</a>
      </nav>
      <div class="side-profile" data-go="settings"><span id="side-avatar"></span><div><b id="side-name">You</b><div class="muted" style="font-size:12px" id="side-rating"></div></div></div>
      <div class="side-foot">Powered by Stockfish 19</div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <noscript>Chess Arena needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
