<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FIFA 27 - Live Match</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
html, body { width: 100%; height: 100%; background: #0a0e27; color: #fff; font-family: 'Arial', sans-serif; overflow: hidden; }

body { display: flex; flex-direction: column; }

.match-wrapper { width: 100%; height: 100vh; display: flex; flex-direction: column; background: linear-gradient(180deg, #0a0e27 0%, #1a1a3e 100%); }

/* SCOREBOARD */
.scoreboard { background: rgba(0, 0, 0, 0.9); border-bottom: 3px solid #ffd700; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.scoreboard-left { display: flex; gap: 20px; align-items: center; }
.team-info { display: flex; gap: 30px; align-items: center; }
.team { display: flex; flex-direction: column; align-items: center; }
.team-name { font-size: 12px; color: #aaa; font-weight: bold; }
.team-score { font-size: 36px; color: #ffd700; font-weight: bold; min-width: 50px; text-align: center; }
.match-time { font-size: 28px; color: #ffd700; font-weight: bold; min-width: 60px; text-align: center; }
.commentators { color: #888; font-size: 11px; text-align: right; }

/* PITCH AREA */
.pitch-area { flex: 1; background: linear-gradient(180deg, #2d5016 0%, #1a3d0a 50%, #2d5016 100%); position: relative; overflow: hidden; display: flex; flex-direction: column; }

/* PITCH */
.pitch { flex: 1; position: relative; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><pattern id="grass" x="20" y="20" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="%231a4d0a"/><rect width="20" height="40" fill="%232d5016"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grass)"/></svg>') repeat; }

/* FIELD LINES */
.pitch::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 3px;
    height: 100%;
    background: #fff;
    opacity: 0.6;
}

.pitch::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 3px;
    background: #fff;
    opacity: 0.6;
    transform: translateY(-50%);
}

/* CENTER CIRCLE */
.center-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    border: 2px solid #fff;
    border-radius: 50%;
    opacity: 0.6;
    transform: translate(-50%, -50%);
}

.center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
    transform: translate(-50%, -50%);
}

/* PLAYERS */
.player {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid;
    transition: all 0.2s;
}

.player.home { background: #fff; color: #000; border-color: #000; }
.player.away { background: #0066ff; color: #fff; border-color: #fff; }

.player-label { position: absolute; bottom: -20px; font-size: 9px; white-space: nowrap; }

/* BALL */
.ball {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #000;
    border: 2px solid #fff;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    z-index: 10;
}

/* COMMENTARY BOX */
.commentary {
    background: rgba(0, 0, 0, 0.8);
    border-top: 2px solid #ffd700;
    padding: 15px 20px;
    max-height: 100px;
}

.commentators-names { font-size: 10px; color: #888; margin-bottom: 8px; }
.commentary-text { font-size: 14px; color: #fff; font-weight: bold; min-height: 40px; }

/* ACTION BUTTONS */
.actions {
    background: rgba(0, 0, 0, 0.9);
    padding: 15px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
    border-top: 2px solid #ffd700;
}

.action-btn {
    padding: 12px;
    background: #ffd700;
    color: #000;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
}

.action-btn:active {
    background: #ffed4e;
    transform: scale(0.95);
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 100;
    justify-content: center;
    align-items: center;
}

.modal.show { display: flex; }

.modal-content {
    background: #1a1a2e;
    border: 3px solid #ffd700;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    max-width: 400px;
}

.modal-title { font-size: 28px; color: #ffd700; font-weight: bold; margin-bottom: 15px; }
.modal-text { font-size: 16px; color: #fff; margin-bottom: 20px; }
.modal-btn { padding: 12px 30px; background: #ffd700; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }

/* STATS */
.stat-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 11px;
    color: #888;
}

.stat-label { flex: 1; }
.stat-value { color: #ffd700; font-weight: bold; }

    </style>
</head>
<body>

<div class="match-wrapper">
    <!-- SCOREBOARD -->
    <div class="scoreboard">
        <div class="scoreboard-left">
            <div class="team-info">
                <div class="team">
                    <div class="team-name">SANF</div>
                    <div class="team-score" id="homeScore">0</div>
                </div>
                <div class="team">
                    <div class="team-name">SCO</div>
                    <div class="team-score" id="awayScore">0</div>
                </div>
            </div>
            <div class="match-time" id="matchTime">00:00</div>
        </div>
        <div class="commentators">
            <div><strong>MATCH COMMENTARY</strong></div>
            <div>Derek Rae | Sue Smith</div>
        </div>
    </div>

    <!-- PITCH AREA -->
    <div class="pitch-area">
        <!-- PITCH -->
        <div class="pitch" id="pitch">
            <div class="center-circle"></div>
            <div class="center-dot"></div>
            <!-- Players will be added here -->
            <!-- Ball will be added here -->
        </div>

        <!-- COMMENTARY -->
        <div class="commentary">
            <div class="commentators-names">Derek Rae • Sue Smith</div>
            <div class="commentary-text" id="commentaryText">Exciting start to the match! Players are settling into the game...</div>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
        <button class="action-btn" id="shootBtn">⚽ SHOOT</button>
        <button class="action-btn" id="passBtn">→ PASS</button>
        <button class="action-btn" id="defendBtn">🛡️ DEFEND</button>
        <button class="action-btn" id="skipBtn">⏭️ SKIP</button>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">🏁 MATCH OVER</div>
        <div class="modal-text" id="modalText">Final Score: 2 - 1</div>
        <button class="modal-btn" id="modalBtn">RETURN TO MENU</button>
    </div>
</div>

<script>
const FIFA = {
    pitch: null,
    pitchWidth: 0,
    pitchHeight: 0,

    homeTeam: { players: [], score: 0 },
    awayTeam: { players: [], score: 0 },

    matchState: {
        time: 0,
        possession: 'home',
        ballPos: { x: 0, y: 0 },
        lastAction: '',
        matchOver: false
    },

    commentaryLines: [
        "Great passing move! The team is playing with intensity!",
        "Derek Rae here - the tempo is rising on the pitch!",
        "Sue Smith: Excellent ball control there!",
        "And WHAT A SHOT! It's a GOAL! Incredible finish!",
        "The defense is holding strong in the back line.",
        "The goalkeeper makes a fantastic save!",
        "GOOOOOAAAAAALLLLL! What a moment!",
        "The ball ricochets off the post - so close!",
        "The crowd goes wild! Unbelievable defending!",
        "Quick counter-attack developing here...",
        "Derek Rae on commentary: Another chance created!",
        "Both teams battling hard for possession.",
        "The midfield is controlled, keeping the play flowing.",
        "Wide pass into the box - dangerous opportunity!",
        "And it's saved! What a diving save from the keeper!",
        "The forward makes a clever run into space.",
        "Another goal! The match is wide open now!",
        "Possession changes hands, back and forth it goes!",
        "They're pressing high up the pitch now.",
        "The referee watching closely for any fouls."
    ],

    init: function() {
        this.pitch = document.getElementById('pitch');
        this.pitchWidth = this.pitch.offsetWidth;
        this.pitchHeight = this.pitch.offsetHeight;

        this.createPlayers();
        this.positionBall();
        this.setupControls();
        this.startMatch();
    },

    createPlayers: function() {
        // Home team (white)
        const homePositions = [
            {x: 10, y: 30}, {x: 25, y: 15}, {x: 25, y: 50}, {x: 25, y: 85},
            {x: 40, y: 20}, {x: 40, y: 50}, {x: 40, y: 80},
            {x: 60, y: 25}, {x: 60, y: 55}, {x: 60, y: 80},
            {x: 80, y: 50}
        ];

        // Away team (blue)
        const awayPositions = [
            {x: 90, y: 30}, {x: 75, y: 15}, {x: 75, y: 50}, {x: 75, y: 85},
            {x: 60, y: 20}, {x: 60, y: 50}, {x: 60, y: 80},
            {x: 40, y: 25}, {x: 40, y: 55}, {x: 40, y: 80},
            {x: 20, y: 50}
        ];

        homePositions.forEach((pos, i) => {
            const player = document.createElement('div');
            player.className = 'player home';
            player.id = 'home-' + i;
            player.innerHTML = (i + 1);
            this.setPlayerPos(player, pos.x, pos.y);
            this.pitch.appendChild(player);
            this.homeTeam.players.push({el: player, pos: pos, num: i + 1});
        });

        awayPositions.forEach((pos, i) => {
            const player = document.createElement('div');
            player.className = 'player away';
            player.id = 'away-' + i;
            player.innerHTML = (i + 1);
            this.setPlayerPos(player, pos.x, pos.y);
            this.pitch.appendChild(player);
            this.awayTeam.players.push({el: player, pos: pos, num: i + 1});
        });
    },

    setPlayerPos: function(el, percentX, percentY) {
        const x = (this.pitchWidth * percentX) / 100;
        const y = (this.pitchHeight * percentY) / 100;
        el.style.left = (x - 15) + 'px';
        el.style.top = (y - 15) + 'px';
    },

    positionBall: function() {
        let ball = document.getElementById('ball');
        if (!ball) {
            ball = document.createElement('div');
            ball.className = 'ball';
            ball.id = 'ball';
            this.pitch.appendChild(ball);
        }
        this.matchState.ballPos = { x: 50, y: 50 };
        this.setBallPos(50, 50);
    },

    setBallPos: function(percentX, percentY) {
        const ball = document.getElementById('ball');
        const x = (this.pitchWidth * percentX) / 100;
        const y = (this.pitchHeight * percentY) / 100;
        ball.style.left = (x - 6) + 'px';
        ball.style.top = (y - 6) + 'px';
    },

    setupControls: function() {
        document.getElementById('shootBtn').addEventListener('click', () => this.shoot());
        document.getElementById('passBtn').addEventListener('click', () => this.pass());
        document.getElementById('defendBtn').addEventListener('click', () => this.defend());
        document.getElementById('skipBtn').addEventListener('click', () => this.skipMatch());
        document.getElementById('modalBtn').addEventListener('click', () => location.reload());
    },

    startMatch: function() {
        this.matchState.time = 0;
        this.updateUI();

        setInterval(() => {
            if (!this.matchState.matchOver) {
                this.matchState.time++;
                if (this.matchState.time % 3 === 0) this.updateUI();
                if (this.matchState.time > 5400) this.endMatch(); // 90 minutes
            }
        }, 1000);
    },

    updateUI: function() {
        const mins = Math.floor(this.matchState.time / 60);
        const secs = this.matchState.time % 60;
        document.getElementById('matchTime').textContent =
            String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        document.getElementById('homeScore').textContent = this.homeTeam.score;
        document.getElementById('awayScore').textContent = this.awayTeam.score;
    },

    shoot: function() {
        if (this.matchState.matchOver) return;

        const chances = { Easy: 0.45, Normal: 0.25, Hard: 0.15, Legendary: 0.08 };
        const shootChance = chances['Normal'] || 0.25;

        if (Math.random() < shootChance) {
            this.homeTeam.score++;
            this.animate(50, 95, 50, 50); // Ball to goal
            this.commentary("GOOOOOAAAAAAALLLLL!!!!! WHAT AN INCREDIBLE FINISH! Derek Rae here - what a moment!");
        } else {
            this.animate(50, 50, 90, 20);
            this.commentary("Sue Smith: Great attempt, but the keeper makes a spectacular save!");
        }

        this.matchState.time += 90 + Math.floor(Math.random() * 60);
        this.updateUI();

        if (this.matchState.time > 5400) this.endMatch();
    },

    pass: function() {
        if (this.matchState.matchOver) return;

        this.animate(50, 50, 30 + Math.random() * 40, 30 + Math.random() * 40);
        this.commentary("Derek Rae: Excellent passing move! The team maintains possession with quick, sharp passes!");

        this.matchState.time += 60 + Math.floor(Math.random() * 50);
        this.updateUI();

        if (this.matchState.time > 5400) this.endMatch();
    },

    defend: function() {
        if (this.matchState.matchOver) return;

        this.animate(80, 50, 70, 50);
        this.commentary("Sue Smith: Solid defensive work! The backline is staying compact and focused!");

        this.matchState.time += 60 + Math.floor(Math.random() * 50);
        this.updateUI();

        if (this.matchState.time > 5400) this.endMatch();
    },

    animate: function(fromX, fromY, toX, toY) {
        const steps = 20;
        let current = 0;

        const interval = setInterval(() => {
            current++;
            const progress = current / steps;
            const x = fromX + (toX - fromX) * progress;
            const y = fromY + (toY - fromY) * progress;
            this.setBallPos(x, y);

            if (current >= steps) {
                clearInterval(interval);
                this.setBallPos(toX, toY);
            }
        }, 50);
    },

    commentary: function(text) {
        const el = document.getElementById('commentaryText');
        el.textContent = text;
        el.style.opacity = '1';
        setTimeout(() => {
            el.style.opacity = '0.7';
        }, 3000);
    },

    skipMatch: function() {
        this.homeTeam.score += Math.floor(Math.random() * 3);
        this.awayTeam.score += Math.floor(Math.random() * 3);
        this.matchState.time = 5400;
        this.endMatch();
    },

    endMatch: function() {
        this.matchState.matchOver = true;
        const diff = this.homeTeam.score - this.awayTeam.score;
        let result = diff > 0 ? 'VICTORY!' : diff < 0 ? 'DEFEAT' : 'DRAW';

        this.showModal('🏁 FINAL WHISTLE',
            `${this.homeTeam.score} - ${this.awayTeam.score}\n${result}`);
    },

    showModal: function(title, text) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalText').textContent = text;
        document.getElementById('modal').classList.add('show');
    }
};

// Start the game
window.addEventListener('load', () => FIFA.init());
</script>

</body>
</html>
